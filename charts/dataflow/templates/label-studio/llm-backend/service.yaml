{{- $service := include "common.service" (dict "ctx" . "service" "labelStudioLlmBackend") | fromYaml }}
{{- $serviceName := include "common.names.custom" (list . $service.name) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/service: {{ $service.name }}
    {{- include "common.labels" . | nindent 4 }}
spec:
  type: {{ dig "service" "type" "ClusterIP" $service }}
  ports:
    - name: {{ dig "service" "name" "http" $service }}
      port: {{ dig "service" "port" 9090 $service }}
      targetPort: {{ dig "service" "port" 9090 $service }}
      protocol: {{ dig "service" "protocol" "TCP" $service }}
  selector:
    app.kubernetes.io/service: {{ $service.name }}
    {{- include "common.labels.selector" . | nindent 4 }}
