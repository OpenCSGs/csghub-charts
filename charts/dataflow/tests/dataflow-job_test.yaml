# Test suite for the dataflow migrations Job.
#
# The Job renders only when dataflow.migrations.enabled is true. It runs a
# psql container that applies the migration scripts from the migrations
# ConfigMap. The PGPASSWORD value is non-deterministic, so it is matched by
# presence, not by exact value.

suite: Test Dataflow Migrations Job
templates:
  - dataflow/job.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the migrations Job metadata and hook annotations
    template: dataflow/job.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-dataflow-migrations"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-upgrade"
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation"

  - it: renders the Job spec defaults
    template: dataflow/job.yaml
    asserts:
      - equal:
          path: spec.activeDeadlineSeconds
          value: 300
      - equal:
          path: spec.backoffLimit
          value: 3
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
      - equal:
          path: spec.template.spec.restartPolicy
          value: "OnFailure"
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30

  - it: renders the wait-for-postgresql init container
    template: dataflow/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "wait-for-postgresql"
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "docker.io/opencsghq/psql:latest"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'postgresql://csghub:.*@csghub-postgresql:5432/csghub_dataflow\?sslmode=disable'

  - it: renders the migrations container with command and env
    template: dataflow/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "migrations"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/psql:latest"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "IfNotPresent"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "for sql_file in /scripts/\\*\\.sql"
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "PGHOST"
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "csghub-postgresql"
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: "PGPORT"
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: "5432"
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: "PGDATABASE"
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: "csghub_dataflow"
      - equal:
          path: spec.template.spec.containers[0].env[3].name
          value: "PGUSER"
      - equal:
          path: spec.template.spec.containers[0].env[3].value
          value: "csghub"
      - equal:
          path: spec.template.spec.containers[0].env[4].name
          value: "PGPASSWORD"
      - equal:
          path: spec.template.spec.containers[0].env[5].name
          value: "PGSSLMODE"
      - equal:
          path: spec.template.spec.containers[0].env[5].value
          value: "disable"

  - it: appends service-level environments after the postgres env vars
    template: dataflow/job.yaml
    set:
      dataflow:
        environments:
          EXTRA: "foo"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[6].name
          value: "EXTRA"
      - equal:
          path: spec.template.spec.containers[0].env[6].value
          value: "foo"

  - it: renders the init-scripts volume from the migrations ConfigMap
    template: dataflow/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "init-scripts"
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: "csghub-dataflow-migrations"
      - equal:
          path: spec.template.spec.volumes[0].configMap.defaultMode
          # The template renders 0744; YAML parses the octal literal as 484.
          value: 484
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "init-scripts"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/scripts"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].readOnly
          value: true

  - it: renders nothing when migrations are disabled
    template: dataflow/job.yaml
    set:
      dataflow:
        migrations:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
