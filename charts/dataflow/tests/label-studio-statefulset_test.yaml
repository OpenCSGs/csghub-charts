# Test suite for the label-studio StatefulSet.
#
# Baseline values come from tests/values.yaml. The StatefulSet mounts a
# wait-for-postgresql init container and a volumeClaimTemplate for the data
# volume. The POSTGRE_PASSWORD in the init container DSN is non-deterministic.

suite: Test Label Studio StatefulSet
templates:
  - label-studio/statefulset.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  ## ------------------------------------------------------------------
  ## Metadata and labels
  ## ------------------------------------------------------------------
  - it: renders the StatefulSet metadata with standard labels
    template: label-studio/statefulset.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-label-studio"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "label-studio"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: "Helm"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: replaces common labels with service-level labels when set
    template: label-studio/statefulset.yaml
    set:
      labelStudio:
        labels:
          foo: "bar"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "label-studio"
      - equal:
          path: metadata.labels["foo"]
          value: "bar"
      - notExists:
          path: metadata.labels["app.kubernetes.io/managed-by"]

  ## ------------------------------------------------------------------
  ## Spec defaults
  ## ------------------------------------------------------------------
  - it: renders the StatefulSet spec defaults
    template: label-studio/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.serviceName
          value: "csghub-label-studio"
      - equal:
          path: spec.minReadySeconds
          value: 30
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/service"]
          value: "label-studio"
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/service"]
          value: "label-studio"
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 20

  - it: omits the service account block when serviceAccountName is not set
    template: label-studio/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: renders the service account block when serviceAccountName is set
    template: label-studio/statefulset.yaml
    set:
      labelStudio:
        serviceAccountName: "custom-sa"
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: "custom-sa"
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  ## ------------------------------------------------------------------
  ## Init container (wait-for-postgresql)
  ## ------------------------------------------------------------------
  - it: renders the wait-for-postgresql init container
    template: label-studio/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "wait-for-postgresql"
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "docker.io/opencsghq/psql:latest"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'postgresql://csghub:.*@csghub-postgresql:5432/csghub_label_studio\?sslmode=disable'

  ## ------------------------------------------------------------------
  ## Container image, command and probes
  ## ------------------------------------------------------------------
  - it: renders the label-studio container with image, command and probes
    template: label-studio/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "label-studio"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/label-studio:v2.4.0"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "IfNotPresent"
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["label-studio"]
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8002
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: "label-studio"
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: "csghub-label-studio"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 8002
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 50
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 5

  - it: renders the data volume mount
    template: label-studio/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "data"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/label-studio/data"

  - it: renders the security context from values
    template: label-studio/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 0

  ## ------------------------------------------------------------------
  ## Image configuration
  ## ------------------------------------------------------------------
  - it: overrides the image registry when registryPolicy is force
    template: label-studio/statefulset.yaml
    set:
      global:
        image:
          registryPolicy: force
          registry: "opencsg-registry.cn-beijing.cr.aliyuncs.com"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/label-studio:v2.4.0"

  - it: prefers service-level pullSecrets over global pullSecrets
    template: label-studio/statefulset.yaml
    set:
      labelStudio:
        image:
          pullSecrets:
            - "svc-secret"
      global:
        image:
          pullSecrets:
            - "global-secret"
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "svc-secret"

  - it: prefers the service-level pull policy over the global pull policy
    template: label-studio/statefulset.yaml
    set:
      labelStudio:
        image:
          pullPolicy: "Always"
      global:
        image:
          pullPolicy: "Never"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "Always"

  ## ------------------------------------------------------------------
  ## Environment variables and resources
  ## ------------------------------------------------------------------
  - it: renders container environment variables when set
    template: label-studio/statefulset.yaml
    set:
      labelStudio:
        environments:
          DEBUG: "false"
          WORKERS: "10"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "DEBUG"
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "false"
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: "WORKERS"
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: "10"

  - it: renders container resources when set
    template: label-studio/statefulset.yaml
    set:
      labelStudio:
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "250m"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "256Mi"

  ## ------------------------------------------------------------------
  ## Scheduling
  ## ------------------------------------------------------------------
  - it: renders nodeSelector, tolerations and affinity when set
    template: label-studio/statefulset.yaml
    set:
      labelStudio:
        nodeSelector:
          diskType: "ssd"
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "csghub"
            effect: "NoSchedule"
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: "kubernetes.io/hostname"
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["diskType"]
          value: "ssd"
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: "dedicated"
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100

  ## ------------------------------------------------------------------
  ## Volume claim template
  ## ------------------------------------------------------------------
  - it: renders the volume claim template from global persistence defaults
    template: label-studio/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: "data"
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: "ReadWriteOnce"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "10Gi"
      - notExists:
          path: spec.volumeClaimTemplates[0].spec.storageClassName

  - it: renders the volume claim template from service-level persistence
    template: label-studio/statefulset.yaml
    set:
      labelStudio:
        persistence:
          accessModes:
            - "ReadWriteMany"
          storageClass: "local"
          size: "100Gi"
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes
          value: ["ReadWriteMany"]
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: "local"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "100Gi"

  ## ------------------------------------------------------------------
  ## Spec overrides
  ## ------------------------------------------------------------------
  - it: renders overridden spec scalars when provided
    template: label-studio/statefulset.yaml
    set:
      labelStudio:
        replicas: 3
        minReadySeconds: 10
        terminationGracePeriodSeconds: 60
        revisionHistoryLimit: 5
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.minReadySeconds
          value: 10
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
      - equal:
          path: spec.revisionHistoryLimit
          value: 5

  - it: renders the update strategy and pod management policy when set
    template: label-studio/statefulset.yaml
    set:
      labelStudio:
        updateStrategy:
          type: "RollingUpdate"
        podManagementPolicy: "OrderedReady"
    asserts:
      - equal:
          path: spec.updateStrategy.type
          value: "RollingUpdate"
      - equal:
          path: spec.podManagementPolicy
          value: "OrderedReady"
