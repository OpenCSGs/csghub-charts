# Test suite for the label-studio-llm-backend Service.
#
# The Service exposes the llm-backend port (9090 by default) and selects pods
# by the llm-backend service label. Both port and targetPort are derived from
# service.port.

suite: Test Label Studio LLM Backend Service
templates:
  - label-studio/llm-backend/service.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the llm-backend Service metadata and labels
    template: label-studio/llm-backend/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-label-studio-llm-backend"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "label-studio-llm-backend"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: "Helm"

  - it: renders the llm-backend Service spec with default port
    template: label-studio/llm-backend/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.ports[0].port
          value: 9090
      - equal:
          path: spec.ports[0].targetPort
          value: 9090
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "http"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "label-studio-llm-backend"
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: "csghub"

  - it: renders a custom port and propagates it to both port and targetPort
    template: label-studio/llm-backend/service.yaml
    set:
      labelStudioLlmBackend:
        service:
          port: 9191
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9191
      - equal:
          path: spec.ports[0].targetPort
          value: 9191

  - it: renders a NodePort type when service.type is overridden
    template: label-studio/llm-backend/service.yaml
    set:
      labelStudioLlmBackend:
        service:
          type: "NodePort"
    asserts:
      - equal:
          path: spec.type
          value: "NodePort"
