# Test suite for the label-studio HTTPRoute.
#
# The HTTPRoute renders only in standalone mode (isBuiltIn=false) and when
# the service-level gateway is enabled. It adds a CORS filter whose
# allowOrigins uses the externalUrl (standalone) or the csghub endpoint
# (built-in, though the route itself is skipped in built-in mode).

suite: Test Label Studio HTTPRoutes
templates:
  - label-studio/httproutes.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the label-studio HTTPRoute with an http parent section
    template: label-studio/httproutes.yaml
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: "csghub-label-studio"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "label-studio"
      - equal:
          path: spec.parentRefs[0].name
          value: "listeners"
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "http"
      - contains:
          path: spec.hostnames
          content: "label-studio.example.com"
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: "PathPrefix"
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: "/"
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: "csghub-label-studio"
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8002

  - it: targets the https parent section when TLS is enabled
    template: label-studio/httproutes.yaml
    set:
      global:
        gateway:
          tls:
            enabled: true
            secretName: "test-tls"
    asserts:
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "https"

  - it: renders the CORS filter with the externalUrl as allow origin
    template: label-studio/httproutes.yaml
    asserts:
      - equal:
          path: spec.rules[0].filters[0].type
          value: "CORS"
      - contains:
          path: spec.rules[0].filters[0].cors.allowOrigins
          content: "https://csghub.example.com"
      - equal:
          path: spec.rules[0].filters[0].cors.allowCredentials
          value: true

  - it: renders the hostname from the label-studio domain with useTop
    template: label-studio/httproutes.yaml
    set:
      global:
        gateway:
          external:
            useTop: true
    asserts:
      - contains:
          path: spec.hostnames
          content: "label-studio.csghub.example.com"

  - it: renders nothing when the service-level gateway is disabled
    template: label-studio/httproutes.yaml
    set:
      labelStudio:
        gateway:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in built-in mode
    template: label-studio/httproutes.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
