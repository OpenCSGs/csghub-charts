# Test suite for the embedded PostgreSQL StatefulSet.
#
# The StatefulSet renders only when built-in PostgreSQL is enabled and the
# chart is in standalone mode. It runs a clear-pgdata init container, mounts
# the runtime ConfigMap, and uses a volumeClaimTemplate for the data volume.

suite: Test PostgreSQL StatefulSet
templates:
  - postgresql/statefulset.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  ## ------------------------------------------------------------------
  ## Metadata and labels
  ## ------------------------------------------------------------------
  - it: renders the StatefulSet metadata with standard labels
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-postgresql"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "postgresql"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: "Helm"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: replaces common labels with service-level labels when set
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        labels:
          foo: "bar"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "postgresql"
      - equal:
          path: metadata.labels["foo"]
          value: "bar"
      - notExists:
          path: metadata.labels["app.kubernetes.io/managed-by"]

  ## ------------------------------------------------------------------
  ## Spec defaults
  ## ------------------------------------------------------------------
  - it: renders the StatefulSet spec defaults
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.serviceName
          value: "csghub-postgresql"
      - equal:
          path: spec.minReadySeconds
          value: 30
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/service"]
          value: "postgresql"
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 20

  - it: omits the service account block when serviceAccountName is not set
    template: postgresql/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName

  ## ------------------------------------------------------------------
  ## Init container (clear-pgdata)
  ## ------------------------------------------------------------------
  - it: renders the clear-pgdata init container
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "clear-pgdata-as-needed"
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "docker.io/busybox:latest"
      - equal:
          path: spec.template.spec.initContainers[0].imagePullPolicy
          value: "IfNotPresent"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "lost\\+found"
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].name
          value: "data"
      - equal:
          path: spec.template.spec.initContainers[0].volumeMounts[0].mountPath
          value: "/var/lib/postgresql/data"

  ## ------------------------------------------------------------------
  ## Container image, args and probes
  ## ------------------------------------------------------------------
  - it: renders the postgres container with image, args and probes
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "postgresql"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/postgres:15.18"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "IfNotPresent"
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["-c", "config_file=/etc/postgresql/runtime.conf"]
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 5432
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: "postgresql"
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: "csghub-postgresql"
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: "csghub-postgresql"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 5432
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 10
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[0]
          value: "pg_isready"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[1]
          value: "-U"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[2]
          value: "csghub"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 15

  - it: renders the data and runtime volume mounts
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "data"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/var/lib/postgresql/data"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: "runtime"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: "/etc/postgresql/runtime.conf"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].subPath
          value: "runtime.conf"

  - it: renders the runtime ConfigMap volume
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "runtime"
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: "csghub-postgresql"

  ## ------------------------------------------------------------------
  ## Image configuration
  ## ------------------------------------------------------------------
  - it: overrides the image registry when registryPolicy is force
    template: postgresql/statefulset.yaml
    set:
      global:
        image:
          registryPolicy: force
          registry: "opencsg-registry.cn-beijing.cr.aliyuncs.com"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/postgres:15.18"

  - it: prefers service-level pullSecrets over global pullSecrets
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        image:
          pullSecrets:
            - "svc-secret"
      global:
        image:
          pullSecrets:
            - "global-secret"
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "svc-secret"

  - it: prefers the service-level pull policy over the global pull policy
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        image:
          pullPolicy: "Always"
      global:
        image:
          pullPolicy: "Never"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "Always"

  ## ------------------------------------------------------------------
  ## Environment variables and resources
  ## ------------------------------------------------------------------
  - it: renders container environment variables when set
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        environments:
          PGDATA: "/data"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "PGDATA"
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "/data"

  - it: renders container resources when set
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "500m"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "512Mi"

  ## ------------------------------------------------------------------
  ## Scheduling
  ## ------------------------------------------------------------------
  - it: renders nodeSelector, tolerations and affinity when set
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        nodeSelector:
          diskType: "ssd"
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "csghub"
            effect: "NoSchedule"
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: "kubernetes.io/hostname"
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["diskType"]
          value: "ssd"
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: "dedicated"
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100

  ## ------------------------------------------------------------------
  ## Volume claim template
  ## ------------------------------------------------------------------
  - it: renders the volume claim template from service-level persistence
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: "data"
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: "ReadWriteOnce"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "50Gi"
      - notExists:
          path: spec.volumeClaimTemplates[0].spec.storageClassName

  - it: renders the volume claim template from local persistence
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        persistence:
          accessModes:
            - "ReadWriteMany"
          storageClass: "local"
          size: "20Gi"
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes
          value: ["ReadWriteMany"]
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: "local"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "20Gi"

  ## ------------------------------------------------------------------
  ## Spec overrides and conditional rendering
  ## ------------------------------------------------------------------
  - it: renders overridden spec scalars when provided
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        replicas: 3
        minReadySeconds: 10
        terminationGracePeriodSeconds: 60
        revisionHistoryLimit: 5
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.minReadySeconds
          value: 10
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
      - equal:
          path: spec.revisionHistoryLimit
          value: 5

  - it: renders the update strategy and pod management policy when set
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        updateStrategy:
          type: "RollingUpdate"
        podManagementPolicy: "OrderedReady"
    asserts:
      - equal:
          path: spec.updateStrategy.type
          value: "RollingUpdate"
      - equal:
          path: spec.podManagementPolicy
          value: "OrderedReady"

  - it: renders nothing when built-in PostgreSQL is disabled
    template: postgresql/statefulset.yaml
    set:
      global:
        postgresql:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in built-in mode
    template: postgresql/statefulset.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
