# Test suite for the dataflow migrations ConfigMap.
#
# The ConfigMap renders only when dataflow.migrations.enabled is true. It
# bundles the SQL migration scripts from the chart scripts/ directory.

suite: Test Dataflow Migrations ConfigMap
templates:
  - dataflow/configmap-migrations.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the migrations ConfigMap metadata and hook annotations
    template: dataflow/configmap-migrations.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-dataflow-migrations"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-upgrade"
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-1"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation"

  - it: bundles the migration SQL scripts
    template: dataflow/configmap-migrations.yaml
    asserts:
      - exists:
          path: data["20260609_dataflow_migrations_init.sql"]
      - exists:
          path: data["20260609_dataflow_rename_tables.sql"]
      - matchRegex:
          path: data["20260609_dataflow_migrations_init.sql"]
          pattern: "Copyright OpenCSG"

  - it: renders nothing when migrations are disabled
    template: dataflow/configmap-migrations.yaml
    set:
      dataflow:
        migrations:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
