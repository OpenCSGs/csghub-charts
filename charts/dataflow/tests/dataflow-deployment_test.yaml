# Test suite for the dataflow Deployment.
#
# Baseline values come from tests/values.yaml. The deployment always renders;
# it mounts the dataflow PVC and runs a wait-for-postgresql init container.
# DATABASE_PASSWORD in the init container DSN is non-deterministic, so the
# init container command is matched by regex, not by exact value.

suite: Test Dataflow Deployment
templates:
  - dataflow/deployment.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  ## ------------------------------------------------------------------
  ## Metadata and labels
  ## ------------------------------------------------------------------
  - it: renders the deployment metadata with standard labels
    template: dataflow/deployment.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-dataflow"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: "Helm"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: replaces common labels with service-level labels when set
    template: dataflow/deployment.yaml
    set:
      dataflow:
        labels:
          foo: "bar"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "dataflow"
      - equal:
          path: metadata.labels["foo"]
          value: "bar"
      - notExists:
          path: metadata.labels["app.kubernetes.io/managed-by"]

  ## ------------------------------------------------------------------
  ## Spec defaults
  ## ------------------------------------------------------------------
  - it: renders the deployment spec defaults
    template: dataflow/deployment.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.minReadySeconds
          value: 30
      - equal:
          path: spec.progressDeadlineSeconds
          value: 600
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/service"]
          value: "dataflow"
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/service"]
          value: "dataflow"
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 20

  - it: omits the service account block when serviceAccountName is not set
    template: dataflow/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: renders the service account block when serviceAccountName is set
    template: dataflow/deployment.yaml
    set:
      dataflow:
        serviceAccountName: "custom-sa"
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: "custom-sa"
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  ## ------------------------------------------------------------------
  ## Init container (wait-for-postgresql)
  ## ------------------------------------------------------------------
  - it: renders the wait-for-postgresql init container
    template: dataflow/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "wait-for-postgresql"
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "docker.io/opencsghq/psql:latest"
      - equal:
          path: spec.template.spec.initContainers[0].imagePullPolicy
          value: "IfNotPresent"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: 'postgresql://csghub:.*@csghub-postgresql:5432/csghub_dataflow\?sslmode=disable'

  ## ------------------------------------------------------------------
  ## Container image and command
  ## ------------------------------------------------------------------
  - it: renders the dataflow container with image, command and probes
    template: dataflow/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "dataflow"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/dataflow:v2.4.0-api"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "IfNotPresent"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "uvicorn data_server.main:app --host 0.0.0.0 --port 8000"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8000
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: "dataflow"
      - equal:
          path: spec.template.spec.containers[0].ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: "csghub-dataflow"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 8000
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30

  - it: renders the data volume mount and volume claim
    template: dataflow/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "data"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/data/dataflow"
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "data"
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: "csghub-dataflow"

  ## ------------------------------------------------------------------
  ## Image configuration
  ## ------------------------------------------------------------------
  - it: overrides the image registry when registryPolicy is force
    template: dataflow/deployment.yaml
    set:
      global:
        image:
          registryPolicy: force
          registry: "opencsg-registry.cn-beijing.cr.aliyuncs.com"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/dataflow:v2.4.0-api"

  - it: prefers service-level pullSecrets over global pullSecrets
    template: dataflow/deployment.yaml
    set:
      dataflow:
        image:
          pullSecrets:
            - "svc-secret"
      global:
        image:
          pullSecrets:
            - "global-secret"
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "svc-secret"

  - it: prefers the service-level pull policy over the global pull policy
    template: dataflow/deployment.yaml
    set:
      dataflow:
        image:
          pullPolicy: "Always"
      global:
        image:
          pullPolicy: "Never"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "Always"

  ## ------------------------------------------------------------------
  ## Environment variables and resources
  ## ------------------------------------------------------------------
  - it: renders container environment variables when set
    template: dataflow/deployment.yaml
    set:
      dataflow:
        environments:
          DEBUG: "false"
          WORKERS: "10"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "DEBUG"
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "false"
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: "WORKERS"
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: "10"

  - it: renders container resources when set
    template: dataflow/deployment.yaml
    set:
      dataflow:
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "250m"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "256Mi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "500m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "512Mi"

  - it: omits the resources block when not configured
    template: dataflow/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources

  ## ------------------------------------------------------------------
  ## Scheduling and probes
  ## ------------------------------------------------------------------
  - it: renders nodeSelector, tolerations and affinity when set
    template: dataflow/deployment.yaml
    set:
      dataflow:
        nodeSelector:
          diskType: "ssd"
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "csghub"
            effect: "NoSchedule"
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: "kubernetes.io/hostname"
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["diskType"]
          value: "ssd"
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: "dedicated"
      - equal:
          path: spec.template.spec.tolerations[0].effect
          value: "NoSchedule"
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100

  - it: renders the readiness probe when set
    template: dataflow/deployment.yaml
    set:
      dataflow:
        readinessProbe:
          httpGet:
            path: "/healthz"
            port: 8000
          initialDelaySeconds: 5
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: "/healthz"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 5

  - it: omits the readiness probe when not configured
    template: dataflow/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe

  - it: renders pod and container security contexts when set
    template: dataflow/deployment.yaml
    set:
      dataflow:
        podSecurityContext:
          fsGroup: 2000
        securityContext:
          readOnlyRootFilesystem: true
          runAsUser: 1000
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 2000
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000

  ## ------------------------------------------------------------------
  ## Spec overrides
  ## ------------------------------------------------------------------
  - it: renders overridden spec scalars when provided
    template: dataflow/deployment.yaml
    set:
      dataflow:
        replicas: 3
        minReadySeconds: 10
        terminationGracePeriodSeconds: 60
        revisionHistoryLimit: 5
        progressDeadlineSeconds: 300
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.minReadySeconds
          value: 10
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 60
      - equal:
          path: spec.revisionHistoryLimit
          value: 5
      - equal:
          path: spec.progressDeadlineSeconds
          value: 300

  - it: renders the rolling update strategy when set
    template: dataflow/deployment.yaml
    set:
      dataflow:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
    asserts:
      - equal:
          path: spec.strategy.type
          value: "RollingUpdate"
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 1
