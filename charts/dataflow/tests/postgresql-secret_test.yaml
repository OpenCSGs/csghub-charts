# Test suite for the embedded PostgreSQL Secret.
#
# The Secret renders only when built-in PostgreSQL is enabled and the chart
# is in standalone mode. The POSTGRES_PASSWORD is generated by
# common.randomPassword and is non-deterministic, so it is matched by base64
# pattern, not by exact value.

suite: Test PostgreSQL Secret
templates:
  - postgresql/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Secret metadata with a keep annotation
    template: postgresql/secret.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-postgresql"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "postgresql"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: "Helm"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: renders the postgres user and a generated password
    template: postgresql/secret.yaml
    asserts:
      - equal:
          path: data.POSTGRES_USER
          value: "Y3NnaHVi"
      - matchRegex:
          path: data.POSTGRES_PASSWORD
          pattern: "^[A-Za-z0-9+/=]+$"
      - equal:
          path: data.POSTGRES_HOST_AUTH_METHOD
          value: "c2NyYW0tc2hhLTI1Ng=="

  - it: renders the multiple databases from the databases list
    template: postgresql/secret.yaml
    asserts:
      - equal:
          path: data.POSTGRES_MULTIPLE_DATABASES
          value: "Y3NnaHViX2RhdGFmbG93LGNzZ2h1Yl9sYWJlbF9zdHVkaW8="

  - it: renders nothing when built-in PostgreSQL is disabled
    template: postgresql/secret.yaml
    set:
      global:
        postgresql:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in built-in mode
    template: postgresql/secret.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
