# Test suite for the dataflow Gateway resources.
#
# The template renders a GatewayClass and a listeners Gateway in standalone
# mode only. The listeners Gateway references the EnvoyProxy CR when the
# controller is envoy, and aggregates TLS certificate refs from the global
# gateway plus the dataflow and label-studio service-level TLS secrets.
#
# Document order follows the template: GatewayClass(0), listeners Gateway(1).

suite: Test Dataflow Gateway
templates:
  - gateway.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  ## ------------------------------------------------------------------
  ## Standalone mode
  ## ------------------------------------------------------------------
  - it: renders the GatewayClass with the configured controller name
    template: gateway.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: GatewayClass
      - equal:
          path: metadata.name
          value: "csghub-gateway"
      - equal:
          path: spec.controllerName
          value: "gateway.envoyproxy.io/gatewayclass-controller"

  - it: renders the listeners Gateway with an envoy proxy parametersRef
    template: gateway.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Gateway
      - equal:
          path: metadata.name
          value: "listeners"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: spec.gatewayClassName
          value: "csghub-gateway"
      - equal:
          path: spec.infrastructure.parametersRef.group
          value: "gateway.envoyproxy.io"
      - equal:
          path: spec.infrastructure.parametersRef.kind
          value: "EnvoyProxy"
      - equal:
          path: spec.infrastructure.parametersRef.name
          value: "csghub-envoy-proxy"
      - equal:
          path: spec.listeners[0].name
          value: "http"
      - equal:
          path: spec.listeners[0].protocol
          value: "HTTP"
      - equal:
          path: spec.listeners[0].port
          value: 80
      - equal:
          path: spec.listeners[0].allowedRoutes.namespaces.from
          value: "Same"

  ## ------------------------------------------------------------------
  ## TLS
  ## ------------------------------------------------------------------
  - it: renders an https listener with the global TLS certificate only
    template: gateway.yaml
    documentIndex: 1
    set:
      global:
        gateway:
          tls:
            enabled: true
            secretName: "test-tls"
    asserts:
      - equal:
          path: spec.listeners[1].name
          value: "https"
      - equal:
          path: spec.listeners[1].protocol
          value: "HTTPS"
      - equal:
          path: spec.listeners[1].port
          value: 443
      - equal:
          path: spec.listeners[1].tls.mode
          value: "Terminate"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].kind
          value: "Secret"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].name
          value: "test-tls"

  - it: aggregates service-level TLS certificates when they differ from global
    template: gateway.yaml
    documentIndex: 1
    set:
      global:
        gateway:
          tls:
            enabled: true
            secretName: "global-tls"
      dataflow:
        gateway:
          tls:
            secretName: "df-tls"
      labelStudio:
        gateway:
          tls:
            secretName: "ls-tls"
    asserts:
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].name
          value: "global-tls"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[1].name
          value: "df-tls"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[2].name
          value: "ls-tls"

  ## ------------------------------------------------------------------
  ## Conditional rendering
  ## ------------------------------------------------------------------
  - it: omits the envoy proxy parametersRef for a non-envoy controller
    template: gateway.yaml
    documentIndex: 1
    set:
      global:
        gateway:
          controllerName: "istio.io/gateway-controller"
    asserts:
      - notExists:
          path: spec.infrastructure

  - it: renders nothing in built-in mode
    template: gateway.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
