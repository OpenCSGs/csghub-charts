# Test suite for the label-studio ConfigMap.
#
# Baseline values come from tests/values.yaml (standalone mode, isBuiltIn=false,
# built-in PostgreSQL enabled). The POSTGRE_PASSWORD is generated by
# common.randomPassword and is non-deterministic, so it is matched by length.

suite: Test Label Studio ConfigMap
templates:
  - label-studio/configmap.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the ConfigMap metadata with standard labels
    template: label-studio/configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-label-studio"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "label-studio"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: "Helm"

  - it: renders the csghub endpoint and label studio host in standalone mode
    template: label-studio/configmap.yaml
    asserts:
      - equal:
          path: data.CSGHUB_ENDPOINT
          value: "https://csghub.example.com"
      - equal:
          path: data.LABEL_STUDIO_HOST
          value: "http://label-studio.example.com"
      - equal:
          path: data.LABEL_STUDIO_PORT
          value: "8002"

  - it: renders the label studio host with the https port when TLS is enabled on NodePort
    template: label-studio/configmap.yaml
    set:
      global:
        gateway:
          service:
            type: NodePort
            nodePorts:
              https: 30443
          tls:
            enabled: true
            secretName: "test-tls"
    asserts:
      - equal:
          path: data.LABEL_STUDIO_HOST
          value: "https://label-studio.example.com:30443"

  - it: renders the static label studio settings
    template: label-studio/configmap.yaml
    asserts:
      - equal:
          path: data.DJANGO_DB
          value: "default"
      - equal:
          path: data.JSON_LOG
          value: "1"

  - it: renders the built-in postgresql connection settings
    template: label-studio/configmap.yaml
    asserts:
      - equal:
          path: data.POSTGRE_HOST
          value: "csghub-postgresql"
      - equal:
          path: data.POSTGRE_PORT
          value: "5432"
      - equal:
          path: data.POSTGRE_NAME
          value: "csghub_label_studio"
      - equal:
          path: data.POSTGRE_USER
          value: "csghub"
      - matchRegex:
          path: data.POSTGRE_PASSWORD
          pattern: "^.{32}$"
      - equal:
          path: data.SSLMODE
          value: "disable"

  - it: renders the global external postgresql connection when built-in is disabled
    template: label-studio/configmap.yaml
    set:
      global:
        postgresql:
          enabled: false
          external:
            host: "pg.external"
            port: 6432
            user: "pguser"
            password: "pgpass"
            sslmode: "prefer"
    asserts:
      - equal:
          path: data.POSTGRE_HOST
          value: "pg.external"
      - equal:
          path: data.POSTGRE_PORT
          value: "6432"
      - equal:
          path: data.POSTGRE_NAME
          value: "csghub_label_studio"
      - equal:
          path: data.POSTGRE_USER
          value: "pguser"
      - equal:
          path: data.POSTGRE_PASSWORD
          value: "pgpass"
      - equal:
          path: data.SSLMODE
          value: "prefer"

  - it: renders the service-level postgresql override with highest priority
    template: label-studio/configmap.yaml
    set:
      global:
        postgresql:
          enabled: false
          external:
            host: "global.host"
            port: 5432
            user: "globaluser"
            password: "globalpass"
      labelStudio:
        postgresql:
          host: "ls.host"
          port: 9999
          database: "lsdb"
          user: "lsuser"
          password: "lspass"
    asserts:
      - equal:
          path: data.POSTGRE_HOST
          value: "ls.host"
      - equal:
          path: data.POSTGRE_PORT
          value: "9999"
      - equal:
          path: data.POSTGRE_NAME
          value: "lsdb"
      - equal:
          path: data.POSTGRE_USER
          value: "lsuser"
      - equal:
          path: data.POSTGRE_PASSWORD
          value: "lspass"

  ## ------------------------------------------------------------------
  ## Built-in (umbrella) mode
  ## ------------------------------------------------------------------
  - it: renders the csghub endpoint and label studio host from the csghub endpoint in built-in mode
    template: label-studio/configmap.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - equal:
          path: data.CSGHUB_ENDPOINT
          value: "http://csghub.example.com"
      - equal:
          path: data.LABEL_STUDIO_HOST
          value: "http://csghub.example.com/-/label-studio"

  ## ------------------------------------------------------------------
  ## Required-value validation
  ## ------------------------------------------------------------------
  - it: fails to render when externalUrl is empty in standalone mode
    template: label-studio/configmap.yaml
    set:
      externalUrl: ""
    asserts:
      - failedTemplate:
          errorPattern: "externalUrl is required"
