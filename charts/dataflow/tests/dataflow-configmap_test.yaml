# Test suite for the dataflow ConfigMap.
#
# Baseline values come from tests/values.yaml (standalone mode, isBuiltIn=false,
# built-in PostgreSQL enabled). Every assertion targets explicitly defined
# values or template fallbacks, so editing defaults in values.yaml cannot
# break this suite.
#
# NOTE: The isBuiltIn=true branch calls common.endpoint.csghub which is defined
# in the csghub umbrella chart; it renders fine standalone but exercises the
# built-in path. The DATABASE_PASSWORD is generated by common.randomPassword
# and is non-deterministic, so it is matched by length, not by exact value.

suite: Test Dataflow ConfigMap
templates:
  - dataflow/configmap.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  ## ------------------------------------------------------------------
  ## Metadata
  ## ------------------------------------------------------------------
  - it: renders the ConfigMap metadata with standard labels
    template: dataflow/configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-dataflow"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: "Helm"

  ## ------------------------------------------------------------------
  ## CSGHub endpoint and studio jump URL (standalone mode)
  ## ------------------------------------------------------------------
  - it: renders the csghub endpoint and studio jump url in standalone mode
    template: dataflow/configmap.yaml
    asserts:
      - equal:
          path: data.CSGHUB_ENDPOINT
          value: "https://csghub.example.com"
      - equal:
          path: data.STUDIO_JUMP_URL
          value: "http://label-studio.example.com"

  - it: renders the studio jump url with the https port when TLS is enabled on NodePort
    template: dataflow/configmap.yaml
    set:
      global:
        gateway:
          service:
            type: NodePort
            nodePorts:
              https: 30443
          tls:
            enabled: true
            secretName: "test-tls"
    asserts:
      - equal:
          path: data.STUDIO_JUMP_URL
          value: "https://label-studio.example.com:30443"

  ## ------------------------------------------------------------------
  ## Static dataflow configuration
  ## ------------------------------------------------------------------
  - it: renders the static dataflow runtime settings
    template: dataflow/configmap.yaml
    asserts:
      - equal:
          path: data.DATA_DIR
          value: "/data/dataflow"
      - equal:
          path: data.MAX_WORKERS
          value: "99"
      - equal:
          path: data.RAY_ADDRESS
          value: "auto"
      - equal:
          path: data.RAY_ENABLE
          value: "False"
      - equal:
          path: data.RAY_LOG_DIR
          value: "/home/output"
      - equal:
          path: data.API_SERVER
          value: "0.0.0.0"
      - equal:
          path: data.API_PORT
          value: "8000"
      - equal:
          path: data.ENABLE_OPENTELEMETRY
          value: "False"

  - it: renders the dataflow template image with the global tag and argo suffix
    template: dataflow/configmap.yaml
    asserts:
      - equal:
          path: data.CSGHUB_DATAFLOW_TEMPLATE_IMAGE
          value: "opencsghq/dataflow:v2.4.0-argo"

  ## ------------------------------------------------------------------
  ## Built-in PostgreSQL connection (default)
  ## ------------------------------------------------------------------
  - it: renders the built-in postgresql connection settings
    template: dataflow/configmap.yaml
    asserts:
      - equal:
          path: data.DATABASE_HOSTNAME
          value: "csghub-postgresql"
      - equal:
          path: data.DATABASE_PORT
          value: "5432"
      - equal:
          path: data.DATABASE_DB
          value: "csghub_dataflow"
      - equal:
          path: data.DATABASE_USERNAME
          value: "csghub"
      - matchRegex:
          path: data.DATABASE_PASSWORD
          pattern: "^.{32}$"

  ## ------------------------------------------------------------------
  ## External PostgreSQL (global)
  ## ------------------------------------------------------------------
  - it: renders the global external postgresql connection when built-in is disabled
    template: dataflow/configmap.yaml
    set:
      global:
        postgresql:
          enabled: false
          external:
            host: "pg.external"
            port: 6432
            user: "pguser"
            password: "pgpass"
            sslmode: "prefer"
    asserts:
      - equal:
          path: data.DATABASE_HOSTNAME
          value: "pg.external"
      - equal:
          path: data.DATABASE_PORT
          value: "6432"
      - equal:
          path: data.DATABASE_DB
          value: "csghub_dataflow"
      - equal:
          path: data.DATABASE_USERNAME
          value: "pguser"
      - equal:
          path: data.DATABASE_PASSWORD
          value: "pgpass"

  ## ------------------------------------------------------------------
  ## Service-level PostgreSQL override (highest priority)
  ## ------------------------------------------------------------------
  - it: renders the service-level postgresql override with highest priority
    template: dataflow/configmap.yaml
    set:
      global:
        postgresql:
          enabled: false
          external:
            host: "global.host"
            port: 5432
            user: "globaluser"
            password: "globalpass"
      dataflow:
        postgresql:
          host: "df.host"
          port: 9999
          database: "dfdb"
          user: "dfuser"
          password: "dfpass"
    asserts:
      - equal:
          path: data.DATABASE_HOSTNAME
          value: "df.host"
      - equal:
          path: data.DATABASE_PORT
          value: "9999"
      - equal:
          path: data.DATABASE_DB
          value: "dfdb"
      - equal:
          path: data.DATABASE_USERNAME
          value: "dfuser"
      - equal:
          path: data.DATABASE_PASSWORD
          value: "dfpass"

  ## ------------------------------------------------------------------
  ## Built-in (umbrella) mode
  ## ------------------------------------------------------------------
  - it: renders the csghub endpoint and studio jump url from the csghub endpoint in built-in mode
    template: dataflow/configmap.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - equal:
          path: data.CSGHUB_ENDPOINT
          value: "http://csghub.example.com"
      - equal:
          path: data.STUDIO_JUMP_URL
          value: "http://csghub.example.com/-/label-studio"
