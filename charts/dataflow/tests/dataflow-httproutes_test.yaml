# Test suite for the dataflow HTTPRoute.
#
# The HTTPRoute renders only in standalone mode (isBuiltIn=false) and when
# the service-level gateway is enabled. The parent section switches between
# http and https based on the global gateway TLS setting.

suite: Test Dataflow HTTPRoutes
templates:
  - dataflow/httproutes.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the runner HTTPRoute with an http parent section
    template: dataflow/httproutes.yaml
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: "csghub-dataflow"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "dataflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: spec.parentRefs[0].name
          value: "listeners"
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "http"
      - contains:
          path: spec.hostnames
          content: "dataflow.example.com"
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: "PathPrefix"
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: "/"
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: "csghub-dataflow"
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8000

  - it: targets the https parent section when TLS is enabled
    template: dataflow/httproutes.yaml
    set:
      global:
        gateway:
          tls:
            enabled: true
            secretName: "test-tls"
    asserts:
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "https"

  - it: renders nothing when the service-level gateway is disabled
    template: dataflow/httproutes.yaml
    set:
      dataflow:
        gateway:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in built-in mode
    template: dataflow/httproutes.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the hostname from the dataflow domain with useTop
    template: dataflow/httproutes.yaml
    set:
      global:
        gateway:
          external:
            useTop: true
    asserts:
      - contains:
          path: spec.hostnames
          content: "dataflow.csghub.example.com"
