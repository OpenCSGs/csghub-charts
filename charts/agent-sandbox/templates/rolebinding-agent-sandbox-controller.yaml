apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-sandbox-controller
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: agent-sandbox-controller
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: agent-sandbox-controller
  apiGroup: rbac.authorization.k8s.io
