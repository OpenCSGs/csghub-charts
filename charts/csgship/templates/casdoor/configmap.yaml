            "Aa123",
            "SpecialChar"
          ],
          "countryCodes": [
            "CN",
            "US"
          ],
          "defaultAvatar": "https://cdn.jsdelivr.net/gh/OpenCSGs/images/robot.png",
          "defaultApplication": "CSGShip",
          "tags": [],
          "languages": [
            "zh",
            "en"
          ],
          "themeData": {
            "themeType": "default",
