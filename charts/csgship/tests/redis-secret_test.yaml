# Test suite for the CSGShip embedded Redis Secret.
#
# The Secret holds the redis password (generated). It renders only when
# redis.requirePass is true, built-in Redis is enabled, and the chart is in
# standalone mode (isBuiltIn=false). The password is non-deterministic and
# matched by regex.

suite: Test Redis Secret
templates:
  - redis/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders nothing when requirePass is false
    template: redis/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Secret metadata with the keep annotation
    template: redis/secret.yaml
    set:
      redis:
        requirePass: true
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-redis"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "redis"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: renders a generated password when requirePass is true
    template: redis/secret.yaml
    set:
      redis:
        requirePass: true
    asserts:
      - matchRegex:
          path: data.REDIS_PASSWD
          pattern: "^[A-Za-z0-9+/=]{44}$"

  - it: renders nothing in built-in mode
    template: redis/secret.yaml
    set:
      redis:
        requirePass: true
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
