# Test suite for the CSGShip casdoor-init Secret.
#
# The Secret owns the init_data.json bootstrap (organization, CSGShip
# application with client credentials, root admin), the admin credentials
# used by the casdoor bootstrap job, and the TLS cert used to sign casdoor
# JWTs. Both the bootstrap data and the TLS cert/key live in a single Opaque
# Secret so the init_data.json's csgship-cert and the TLS cert are guaranteed
# to be the same certificate. It renders only in standalone mode
# (isBuiltIn=false).

suite: Test Casdoor Init Secret
templates:
  - casdoor/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Secret metadata with the keep annotation
    template: casdoor/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-casdoor-init"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "casdoor"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: encodes the admin credentials from the baseline values
    template: casdoor/secret.yaml
    asserts:
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_USER
          value: "root"
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_PASSWORD
          value: "test-admin-password"
      - matchRegex:
          decodeBase64: true
          path: data.INIT_ADMIN_HTPASSWD
          pattern: "^\\$2[aby]\\$10\\$[A-Za-z0-9./]{53}$"

  - it: encodes a custom admin name and password when set
    template: casdoor/secret.yaml
    set:
      casdoor:
        admin:
          name: "adminUser"
          password: "adminPassword"
    asserts:
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_USER
          value: "adminUser"
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_PASSWORD
          value: "adminPassword"
      - matchRegex:
          decodeBase64: true
          path: data.INIT_ADMIN_HTPASSWD
          pattern: "^\\$2[aby]\\$10\\$[A-Za-z0-9./]{53}$"

  - it: renders a generated password when the admin password is not set
    template: casdoor/secret.yaml
    set:
      casdoor:
        admin:
          name: root
          password: ""
    asserts:
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_USER
          value: "root"
      - matchRegex:
          decodeBase64: true
          path: data.INIT_ADMIN_PASSWORD
          pattern: "^[A-Za-z0-9+/]{32}$"

  - it: encodes the TLS cert and key generated for casdoor
    template: casdoor/secret.yaml
    asserts:
      - matchRegex:
          decodeBase64: true
          path: data["tls.crt"]
          pattern: "-----BEGIN CERTIFICATE-----"
      - matchRegex:
          decodeBase64: true
          path: data["tls.crt"]
          pattern: "-----END CERTIFICATE-----"
      - matchRegex:
          decodeBase64: true
          path: data["tls.key"]
          pattern: "-----BEGIN RSA PRIVATE KEY-----"
      - matchRegex:
          decodeBase64: true
          path: data["tls.key"]
          pattern: "-----END RSA PRIVATE KEY-----"

  - it: embeds the CSGShip application with client credentials in init_data
    template: casdoor/secret.yaml
    asserts:
      - matchRegex:
          path: stringData["init_data.json"]
          pattern: |-
            "websiteUrl":\s*"https://csgship\.example\.com"
      - matchRegex:
          path: stringData["init_data.json"]
          pattern: |-
            "homepageUrl":\s*"https://csgship\.example\.com"
      - matchRegex:
          path: stringData["init_data.json"]
          pattern: |-
            "clientId":\s*"[0-9a-f]{20}"
      - matchRegex:
          path: stringData["init_data.json"]
          pattern: |-
            "clientSecret":\s*"[0-9a-f]{40}"

  - it: embeds the root admin with a bcrypt password hash
    template: casdoor/secret.yaml
    asserts:
      - matchRegex:
          path: stringData["init_data.json"]
          pattern: |-
            "name":\s*"root"
      - matchRegex:
          path: stringData["init_data.json"]
          pattern: |-
            "password":\s*"[^\"]{60}"
      - matchRegex:
          path: stringData["init_data.json"]
          pattern: |-
            "email":\s*"root@example\.com"

  ## ------------------------------------------------------------------
  ## The init_data.json's csgship-cert and the TLS cert are the same cert
  ## because both come from the same $ca source in the template.
  ## ------------------------------------------------------------------
  - it: embeds the csgship-cert in init_data.json with the same cert as the TLS Secret
    template: casdoor/secret.yaml
    asserts:
      - matchRegex:
          path: stringData["init_data.json"]
          pattern: '"name":\s*"csgship-cert"'
      - matchRegex:
          path: stringData["init_data.json"]
          pattern: |-
            "scope":\s*"JWT"
      - matchRegex:
          path: stringData["init_data.json"]
          pattern: |-
            "type":\s*"x509"
      - matchRegex:
          path: stringData["init_data.json"]
          pattern: |-
            "certificate":\s*"-----BEGIN CERTIFICATE-----
      - matchRegex:
          path: stringData["init_data.json"]
          pattern: |-
            "privateKey":\s*"-----BEGIN RSA PRIVATE KEY-----

  - it: renders nothing in built-in mode
    template: casdoor/secret.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
