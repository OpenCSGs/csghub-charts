# Test suite for the CSGShip casdoor init Secret.
#
# The Secret holds the initial casdoor admin credentials. With the baseline
# admin name/password set, INIT_ADMIN_USER and INIT_ADMIN_PASSWORD are
# deterministic; the htpasswd hash is a non-deterministic bcrypt value and is
# matched by regex. It renders only in standalone mode (isBuiltIn=false).

suite: Test Casdoor Secret
templates:
  - casdoor/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Secret metadata with the keep annotation
    template: casdoor/secret.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-casdoor-init"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "casdoor"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: encodes the admin user and password from the baseline values
    template: casdoor/secret.yaml
    asserts:
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_USER
          value: "root"
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_PASSWORD
          value: "test-admin-password"
      - matchRegex:
          decodeBase64: true
          path: data.INIT_ADMIN_HTPASSWD
          pattern: "^\\$2[aby]\\$10\\$[A-Za-z0-9./]{53}$"

  - it: encodes a custom admin name and password when set
    template: casdoor/secret.yaml
    set:
      casdoor:
        admin:
          name: "adminUser"
          password: "adminPassword"
    asserts:
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_USER
          value: "adminUser"
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_PASSWORD
          value: "adminPassword"
      - matchRegex:
          decodeBase64: true
          path: data.INIT_ADMIN_HTPASSWD
          pattern: "^\\$2[aby]\\$10\\$[A-Za-z0-9./]{53}$"

  - it: renders a generated password when the admin password is not set
    template: casdoor/secret.yaml
    set:
      casdoor:
        admin:
          name: root
          password: ""
    asserts:
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_USER
          value: "root"
      - matchRegex:
          decodeBase64: true
          path: data.INIT_ADMIN_PASSWORD
          pattern: "^[A-Za-z0-9+/]{32}$"

  - it: renders nothing in built-in mode
    template: casdoor/secret.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
