# Test suite for the CSGShip embedded PostgreSQL Service.
#
# The headless Service (clusterIP None) exposes postgres on port 5432. It
# renders only when built-in PostgreSQL is enabled and the chart is in
# standalone mode (isBuiltIn=false).

suite: Test PostgreSQL Service
templates:
  - postgresql/service.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Service metadata with standard labels
    template: postgresql/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-postgresql"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "postgresql"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "csgship"

  - it: renders the headless service with port 5432
    template: postgresql/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.clusterIP
          value: "None"
      - equal:
          path: spec.ports[0].port
          value: 5432
      - equal:
          path: spec.ports[0].targetPort
          value: 5432
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "postgresql"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "postgresql"

  - it: overrides the service port and protocol when set
    template: postgresql/service.yaml
    set:
      postgresql:
        service:
          type: "NodePort"
          port: 6432
          protocol: "UDP"
    asserts:
      - equal:
          path: spec.type
          value: "NodePort"
      - equal:
          path: spec.ports[0].port
          value: 6432
      - equal:
          path: spec.ports[0].protocol
          value: "UDP"

  - it: renders nothing when built-in PostgreSQL is disabled
    template: postgresql/service.yaml
    set:
      global:
        postgresql:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
