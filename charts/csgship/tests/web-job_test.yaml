# Test suite for the CSGShip web init Job.
#
# The Job runs the SQL init scripts against the web database. It waits for
# PostgreSQL and the web service via init containers, then executes the
# psql scripts. The init-scripts volume mounts the csghub-csgship-init
# ConfigMap with defaultMode 0744 (parsed as 484 by helm-unittest).
#
# The PostgreSQL password is non-deterministic and matched by regex.

suite: Test Web Job
templates:
  - web/job.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  ## ------------------------------------------------------------------
  ## Metadata and spec defaults
  ## ------------------------------------------------------------------
  - it: renders the Job metadata and spec defaults
    template: web/job.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-csgship-init"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "csgship"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
      - equal:
          path: spec.activeDeadlineSeconds
          value: 1200
      - equal:
          path: spec.backoffLimit
          value: 5
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
      - equal:
          path: spec.template.spec.restartPolicy
          value: "OnFailure"
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 30

  ## ------------------------------------------------------------------
  ## Init containers
  ## ------------------------------------------------------------------
  - it: renders the postgresql and web wait init containers
    template: web/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "wait-for-postgresql"
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "docker.io/opencsghq/psql:latest"
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: "wait-for-web"
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: "docker.io/busybox:latest"
      - matchRegex:
          path: spec.template.spec.initContainers[1].command[2]
          pattern: "until nc -z csghub-csgship 8000"

  ## ------------------------------------------------------------------
  ## Main container
  ## ------------------------------------------------------------------
  - it: renders the psql container with the postgresql connection env
    template: web/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "csgship"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/psql:latest"
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "PGHOST"
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "csghub-postgresql"
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: "PGPORT"
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: "5432"
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: "PGDATABASE"
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: "csghub_csgship"
      - equal:
          path: spec.template.spec.containers[0].env[3].name
          value: "PGUSER"
      - equal:
          path: spec.template.spec.containers[0].env[3].value
          value: "csghub"
      - equal:
          path: spec.template.spec.containers[0].env[4].name
          value: "PGPASSWORD"
      - matchRegex:
          path: spec.template.spec.containers[0].env[4].value
          pattern: "^[A-Za-z0-9+/]{32}$"

  ## ------------------------------------------------------------------
  ## Volumes
  ## ------------------------------------------------------------------
  - it: mounts the init-scripts ConfigMap volume with defaultMode 0744
    template: web/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "init-scripts"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/scripts"
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "init-scripts"
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: "csghub-csgship-init"
      - equal:
          path: spec.template.spec.volumes[0].configMap.defaultMode
          value: 484

  ## ------------------------------------------------------------------
  ## Optional fields
  ## ------------------------------------------------------------------
  - it: appends environments and node selector when set
    template: web/job.yaml
    set:
      web:
        environments:
          EXTRA: "value"
        nodeSelector:
          diskType: ssd
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[5].name
          value: "EXTRA"
      - equal:
          path: spec.template.spec.containers[0].env[5].value
          value: "value"
      - equal:
          path: spec.template.spec.nodeSelector.diskType
          value: "ssd"

  - it: overrides the postgresql settings from the service-level config
    template: web/job.yaml
    set:
      web:
        postgresql:
          host: "10.0.0.5"
          port: 5433
          database: "csgship_web"
          user: "webuser"
          password: "webpass"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "10.0.0.5"
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: "5433"
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: "csgship_web"
      - equal:
          path: spec.template.spec.containers[0].env[3].value
          value: "webuser"
      - equal:
          path: spec.template.spec.containers[0].env[4].value
          value: "webpass"
