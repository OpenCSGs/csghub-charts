# Test suite for the CSGShip embedded PostgreSQL ConfigMap.
#
# The ConfigMap holds the postgres runtime.conf that includes the default
# postgresql.conf plus the rendered parameters. It renders only when built-in
# PostgreSQL is enabled and the chart is in standalone mode (isBuiltIn=false).

suite: Test PostgreSQL ConfigMap
templates:
  - postgresql/configmap.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the ConfigMap metadata with standard labels
    template: postgresql/configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: "csghub-postgresql"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "postgresql"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"

  - it: includes the default postgresql.conf in runtime.conf
    template: postgresql/configmap.yaml
    asserts:
      - matchRegex:
          path: data["runtime.conf"]
          pattern: "include_if_exists = '/var/lib/postgresql/data/postgresql.conf'"

  - it: renders the runtime parameters when set
    template: postgresql/configmap.yaml
    set:
      postgresql:
        parameters:
          max_connections: 666
          shared_buffers: "1024MB"
    asserts:
      - matchRegex:
          path: data["runtime.conf"]
          pattern: "max_connections = '666'"
      - matchRegex:
          path: data["runtime.conf"]
          pattern: "shared_buffers = '1024MB'"

  - it: renders nothing when built-in PostgreSQL is disabled
    template: postgresql/configmap.yaml
    set:
      global:
        postgresql:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in built-in mode
    template: postgresql/configmap.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
