# Test suite for the CSGShip embedded Redis Service.
#
# The headless Service (clusterIP None) exposes redis on port 6379. It
# renders only when built-in Redis is enabled and the chart is in standalone
# mode (isBuiltIn=false).

suite: Test Redis Service
templates:
  - redis/service.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Service metadata with standard labels
    template: redis/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-redis"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "redis"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "csgship"

  - it: renders the headless service with port 6379
    template: redis/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.clusterIP
          value: "None"
      - equal:
          path: spec.ports[0].port
          value: 6379
      - equal:
          path: spec.ports[0].targetPort
          value: 6379
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "redis"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "redis"

  - it: overrides the service port and type when set
    template: redis/service.yaml
    set:
      redis:
        service:
          type: "NodePort"
          port: 6378
    asserts:
      - equal:
          path: spec.type
          value: "NodePort"
      - equal:
          path: spec.ports[0].port
          value: 6378

  - it: renders nothing when built-in Redis is disabled
    template: redis/service.yaml
    set:
      global:
        redis:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
