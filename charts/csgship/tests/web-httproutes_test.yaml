# Test suite for the CSGShip web HTTPRoute.
#
# The route targets the webAPI domain and uses the https parent section when
# the global gateway TLS is enabled. Both rules reference the web service:
# rule[1] (the /agentic path) reuses the web service definition, so its
# backendRefs.name is also csghub-csgship. This quirk is tested as-is.

suite: Test Web HTTPRoutes
templates:
  - web/httproutes.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the HTTPRoute metadata with standard labels
    template: web/httproutes.yaml
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: "csghub-csgship"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "csgship"

  - it: targets the https parent section and the webAPI domain when TLS is enabled
    template: web/httproutes.yaml
    asserts:
      - equal:
          path: spec.parentRefs[0].name
          value: "listeners"
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "https"
      - contains:
          path: spec.hostnames
          content: "csgship-api.example.com"

  - it: targets the http parent section when TLS is disabled
    template: web/httproutes.yaml
    set:
      global:
        gateway:
          tls:
            enabled: false
            secretName: ""
    asserts:
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "http"

  - it: routes the root path to the web service
    template: web/httproutes.yaml
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: "PathPrefix"
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: "/"
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: "csghub-csgship"
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8000

  - it: routes the agentic path to the web service (template reuses web backend)
    template: web/httproutes.yaml
    asserts:
      - equal:
          path: spec.rules[1].matches[0].path.value
          value: "/agentic"
      - equal:
          path: spec.rules[1].backendRefs[0].name
          value: "csghub-csgship"
      - equal:
          path: spec.rules[1].backendRefs[0].port
          value: 8000

  - it: renders nothing when the service-level gateway is disabled
    template: web/httproutes.yaml
    set:
      web:
        gateway:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
