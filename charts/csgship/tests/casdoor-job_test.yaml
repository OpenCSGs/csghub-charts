# Test suite for the CSGShip casdoor migrate Job.
#
# The Job applies the casdoor database update SQL. It waits for casdoor,
# sources the web ConfigMap plus the casdoor-init Secret, and runs as root to
# write to the database. It renders only in standalone mode (isBuiltIn=false).

suite: Test Casdoor Job
templates:
  - casdoor/job.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Job metadata with hook annotations
    template: casdoor/job.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-casdoor-migrate"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "casdoor"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation"

  - it: renders the Job spec defaults
    template: casdoor/job.yaml
    asserts:
      - equal:
          path: spec.parallelism
          value: 1
      - equal:
          path: spec.completions
          value: 1
      - equal:
          path: spec.activeDeadlineSeconds
          value: 1200
      - equal:
          path: spec.backoffLimit
          value: 5
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 300
      - equal:
          path: spec.completionMode
          value: "Indexed"
      - equal:
          path: spec.template.spec.restartPolicy
          value: "OnFailure"

  - it: renders the casdoor wait init container
    template: casdoor/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "wait-for-casdoor"
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "docker.io/busybox:latest"

  - it: renders the psql container sourcing the web ConfigMap and casdoor secret
    template: casdoor/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "casdoor"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/psql:latest"
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: "csghub-csgship"
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: "csghub-casdoor-init"
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 0

  - it: renders the external endpoint and postgresql env
    template: casdoor/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "CSGSHIP_EXTERNAL_ENDPOINT"
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "https://csgship-api.example.com"
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: "PGHOST"
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: "csghub-postgresql"
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: "PGPORT"
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: "5432"
      - equal:
          path: spec.template.spec.containers[0].env[3].name
          value: "PGDATABASE"
      - equal:
          path: spec.template.spec.containers[0].env[3].value
          value: "csghub_casdoor"
      - equal:
          path: spec.template.spec.containers[0].env[4].name
          value: "PGUSER"
      - equal:
          path: spec.template.spec.containers[0].env[4].value
          value: "csghub"
      - equal:
          path: spec.template.spec.containers[0].env[5].name
          value: "PGPASSWORD"
      - matchRegex:
          path: spec.template.spec.containers[0].env[5].value
          pattern: "^[A-Za-z0-9+/]{32}$"

  - it: renders the oauth env from the web oauth settings
    template: casdoor/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[6].name
          value: "OAUTH_CLIENT_ID"
      - equal:
          path: spec.template.spec.containers[0].env[6].value
          value: "gitlab-client-id"
      - equal:
          path: spec.template.spec.containers[0].env[7].name
          value: "OAUTH_CLIENT_SECRET"
      - equal:
          path: spec.template.spec.containers[0].env[7].value
          value: "gitlab-client-secret"
      - equal:
          path: spec.template.spec.containers[0].env[8].name
          value: "OAUTH_ISSUER"
      - equal:
          path: spec.template.spec.containers[0].env[8].value
          value: "https://gitlab.example.com"
      - equal:
          path: spec.template.spec.containers[0].env[9].name
          value: "CSGSHIP_CLIENT_ID"
      - equal:
          path: spec.template.spec.containers[0].env[9].value
          value: "$(CASDOOR_CLIENT_ID)"
      - equal:
          path: spec.template.spec.containers[0].env[10].name
          value: "CSGSHIP_CLIENT_SECRET"
      - equal:
          path: spec.template.spec.containers[0].env[10].value
          value: "$(CASDOOR_SECRET_KEY)"

  - it: mounts the casdoor ConfigMap volume with defaultMode 0744
    template: casdoor/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "update-conf"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/scripts"
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "update-conf"
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: "csghub-casdoor"
      - equal:
          path: spec.template.spec.volumes[0].configMap.defaultMode
          value: 484

  - it: renders nothing in built-in mode
    template: casdoor/job.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
