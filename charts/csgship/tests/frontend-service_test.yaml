# Test suite for the CSGShip frontend Service.
#
# The frontend Service exposes nginx on port 80.

suite: Test Frontend Service
templates:
  - frontend/service.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Service metadata with standard labels
    template: frontend/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-frontend"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "frontend"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "csgship"

  - it: renders the single port 80 with the default ClusterIP type
    template: frontend/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: 80
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "frontend"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "frontend"
