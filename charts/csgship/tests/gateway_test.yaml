# Test suite for the CSGShip Gateway resources.
#
# The template renders a GatewayClass and a Gateway in one file. helm-unittest
# preserves the file order, so the GatewayClass is document 0 and the Gateway
# is document 1; tests select documents via documentIndex. The resources render
# only in standalone mode (isBuiltIn=false).
#
# With the envoyproxy controller, the Gateway references the csghub-envoy-proxy
# EnvoyProxy via infrastructure.parametersRef. The https listener references
# the global TLS secret plus any distinct web/casdoor TLS secrets.

suite: Test Gateway Resources
templates:
  - gateway.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  ## ------------------------------------------------------------------
  ## Gateway
  ## ------------------------------------------------------------------
  - it: renders the Gateway with the http and https listeners
    template: gateway.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Gateway
      - equal:
          path: metadata.name
          value: "listeners"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: spec.gatewayClassName
          value: "csghub-gateway"
      - equal:
          path: spec.infrastructure.parametersRef.group
          value: "gateway.envoyproxy.io"
      - equal:
          path: spec.infrastructure.parametersRef.kind
          value: "EnvoyProxy"
      - equal:
          path: spec.infrastructure.parametersRef.name
          value: "csghub-envoy-proxy"
      - equal:
          path: spec.listeners[0].name
          value: "http"
      - equal:
          path: spec.listeners[0].protocol
          value: "HTTP"
      - equal:
          path: spec.listeners[0].port
          value: 80

  - it: renders the https listener with the global TLS secret
    template: gateway.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.listeners[1].name
          value: "https"
      - equal:
          path: spec.listeners[1].protocol
          value: "HTTPS"
      - equal:
          path: spec.listeners[1].port
          value: 443
      - equal:
          path: spec.listeners[1].tls.mode
          value: "Terminate"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].kind
          value: "Secret"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].name
          value: "csghub-tls"

  - it: appends distinct web and casdoor TLS secrets to the certificate refs
    template: gateway.yaml
    documentIndex: 1
    set:
      web:
        gateway:
          tls:
            secretName: "web-tls"
      casdoor:
        gateway:
          tls:
            secretName: "casdoor-tls"
    asserts:
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].name
          value: "csghub-tls"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[1].name
          value: "web-tls"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[2].name
          value: "casdoor-tls"

  - it: omits the https listener when TLS is disabled
    template: gateway.yaml
    documentIndex: 1
    set:
      global:
        gateway:
          tls:
            enabled: false
            secretName: ""
    asserts:
      - equal:
          path: spec.listeners[0].name
          value: "http"
      - notExists:
          path: spec.listeners[1]

  ## ------------------------------------------------------------------
  ## GatewayClass
  ## ------------------------------------------------------------------
  - it: renders the GatewayClass with the envoyproxy controller
    template: gateway.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: GatewayClass
      - equal:
          path: metadata.name
          value: "csghub-gateway"
      - equal:
          path: spec.controllerName
          value: "gateway.envoyproxy.io/gatewayclass-controller"

  ## ------------------------------------------------------------------
  ## Gating
  ## ------------------------------------------------------------------
  - it: renders nothing in built-in mode
    template: gateway.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
