# Test suite for the CSGShip embedded PostgreSQL Secret.
#
# The Secret holds the postgres user, a generated password, the multiple
# databases list and the host auth method. It renders only when built-in
# PostgreSQL is enabled and the chart is in standalone mode (isBuiltIn=false).
# The password is non-deterministic and matched by regex.

suite: Test PostgreSQL Secret
templates:
  - postgresql/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Secret metadata with the keep annotation
    template: postgresql/secret.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-postgresql"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "postgresql"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: encodes the postgres user and a generated password
    template: postgresql/secret.yaml
    asserts:
      - equal:
          decodeBase64: true
          path: data.POSTGRES_USER
          value: "csghub"
      - matchRegex:
          path: data.POSTGRES_PASSWORD
          pattern: "^[A-Za-z0-9+/=]{44}$"

  - it: encodes the multiple databases list and host auth method
    template: postgresql/secret.yaml
    asserts:
      - equal:
          decodeBase64: true
          path: data.POSTGRES_MULTIPLE_DATABASES
          value: "csghub_csgship,csghub_casdoor"
      - equal:
          decodeBase64: true
          path: data.POSTGRES_HOST_AUTH_METHOD
          value: "scram-sha-256"

  - it: omits the multiple databases key when no databases are set
    template: postgresql/secret.yaml
    set:
      postgresql:
        databases: []
    asserts:
      - notExists:
          path: data.POSTGRES_MULTIPLE_DATABASES

  - it: renders nothing in built-in mode
    template: postgresql/secret.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
