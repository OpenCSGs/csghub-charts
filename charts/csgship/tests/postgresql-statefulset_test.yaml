# Test suite for the CSGShip embedded PostgreSQL StatefulSet.
#
# The StatefulSet runs the clear-pgdata init container and the postgres
# container with a runtime.conf config file. It renders only when built-in
# PostgreSQL is enabled and the chart is in standalone mode (isBuiltIn=false).
# A volumeClaimTemplate provisions the data volume.

suite: Test PostgreSQL StatefulSet
templates:
  - postgresql/statefulset.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the StatefulSet metadata and spec defaults
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-postgresql"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "postgresql"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.serviceName
          value: "csghub-postgresql"
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/service"]
          value: "postgresql"
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 20

  - it: renders the clear-pgdata init container
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "clear-pgdata-as-needed"
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "docker.io/busybox:latest"

  - it: renders the postgres container with the runtime config args
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "postgresql"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/postgres:15.18"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "IfNotPresent"
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - "-c"
            - "config_file=/etc/postgresql/runtime.conf"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 5432
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: "postgresql"
      - equal:
          path: spec.template.spec.containers[0].ports[0].protocol
          value: "TCP"

  - it: sources the postgres ConfigMap and Secret
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: "csghub-postgresql"
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: "csghub-postgresql"

  - it: mounts the data and runtime volumes
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "data"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/var/lib/postgresql/data"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: "runtime"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: "/etc/postgresql/runtime.conf"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].subPath
          value: "runtime.conf"
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "runtime"
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: "csghub-postgresql"

  - it: renders the liveness and readiness probes
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 5432
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[0]
          value: "pg_isready"

  - it: provisions the data volume claim template
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: "data"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: "ReadWriteOnce"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "50Gi"

  - it: overrides the image registry when registryPolicy is force
    template: postgresql/statefulset.yaml
    set:
      global:
        image:
          registryPolicy: force
          registry: "opencsg-registry.cn-beijing.cr.aliyuncs.com"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/postgres:15.18"

  - it: renders node selector, environments and persistence overrides when set
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        environments:
          POSTGRES_DATA: "/var/lib/postgresql/data"
        persistence:
          storageClass: "hostPath"
          accessModes:
            - ReadWriteOnce
          size: "20Gi"
        nodeSelector:
          diskType: ssd
        updateStrategy:
          type: RollingUpdate
        podManagementPolicy: "Parallel"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "POSTGRES_DATA"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: "hostPath"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "20Gi"
      - equal:
          path: spec.template.spec.nodeSelector.diskType
          value: "ssd"
      - equal:
          path: spec.updateStrategy.type
          value: "RollingUpdate"
      - equal:
          path: spec.podManagementPolicy
          value: "Parallel"

  - it: renders nothing when built-in PostgreSQL is disabled
    template: postgresql/statefulset.yaml
    set:
      global:
        postgresql:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in built-in mode
    template: postgresql/statefulset.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
