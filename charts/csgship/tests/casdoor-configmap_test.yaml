# Test suite for the CSGShip casdoor ConfigMap.
#
# The ConfigMap holds only app.conf (with the postgres DSN) and a casdoor
# database update SQL file. The init_data.json bootstrap moved into the
# csghub-casdoor-init Secret and is mounted at /conf-secrets. It renders only
# in standalone mode (isBuiltIn=false).
#
# The postgres password is non-deterministic and matched by regex.

suite: Test Casdoor ConfigMap
templates:
  - casdoor/configmap.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the ConfigMap metadata with standard labels
    template: casdoor/configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-casdoor"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "casdoor"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "csgship"

  - it: renders the app.conf data source name and origin
    template: casdoor/configmap.yaml
    asserts:
      - matchRegex:
          path: data["app.conf"]
          pattern: "dataSourceName\\s*=\\s*\"postgresql://csghub:[A-Za-z0-9+/=]{32}@csghub-postgresql:5432/csghub_casdoor\\?sslmode=disable\""
      - matchRegex:
          path: data["app.conf"]
          pattern: "origin\\s*=\\s*\"https://casdoor\\.example\\.com\""

  - it: points initDataFile at the mounted init Secret
    template: casdoor/configmap.yaml
    asserts:
      - matchRegex:
          path: data["app.conf"]
          pattern: "initDataFile\\s*=\\s*\"/conf-secrets/init_data\\.json\""

  - it: does not embed init_data.json in the ConfigMap
    template: casdoor/configmap.yaml
    asserts:
      - notExists:
          path: data["init_data.json"]

  - it: embeds the casdoor database update SQL file
    template: casdoor/configmap.yaml
    asserts:
      - isNotNullOrEmpty:
          path: data["1768547229_casdoor_update_conf.sql"]

  - it: renders nothing in built-in mode
    template: casdoor/configmap.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
