# Test suite for the CSGShip casdoor ConfigMap.
#
# The ConfigMap embeds app.conf (with the postgres DSN), init_data.json
# (organizations/applications/certs/users/providers) and a casdoor database
# update SQL file. It renders only in standalone mode (isBuiltIn=false).
#
# The postgres password and the bcrypt admin password hash are
# non-deterministic and matched by regex. The clientId/clientSecret of the
# CSGShip casdoor application are also generated per render.

suite: Test Casdoor ConfigMap
templates:
  - casdoor/configmap.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the ConfigMap metadata with standard labels
    template: casdoor/configmap.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "csghub-casdoor"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "casdoor"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "csgship"

  - it: renders the app.conf data source name and origin
    template: casdoor/configmap.yaml
    asserts:
      - matchRegex:
          path: data["app.conf"]
          pattern: "dataSourceName\\s*=\\s*\"postgresql://csghub:[A-Za-z0-9+/=]{32}@csghub-postgresql:5432/csghub_casdoor\\?sslmode=disable\""
      - matchRegex:
          path: data["app.conf"]
          pattern: "origin\\s*=\\s*\"https://casdoor\\.example\\.com\""

  - it: renders the init_data organization and application web endpoints
    template: casdoor/configmap.yaml
    asserts:
      - matchRegex:
          path: data["init_data.json"]
          pattern: "\"websiteUrl\":\\s*\"https://csgship\\.example\\.com\""
      - matchRegex:
          path: data["init_data.json"]
          pattern: "\"homepageUrl\":\\s*\"https://csgship\\.example\\.com\""
      - matchRegex:
          path: data["init_data.json"]
          pattern: "\"redirectUris\":\\s*\\[\\s*\"https://csgship-api\\.example\\.com/api/v1/account/casdoor/login/callback\""

  - it: renders the CSGShip application credentials
    template: casdoor/configmap.yaml
    asserts:
      - matchRegex:
          path: data["init_data.json"]
          pattern: "\"clientId\":\\s*\"[0-9a-f]{20}\""
      - matchRegex:
          path: data["init_data.json"]
          pattern: "\"clientSecret\":\\s*\"[0-9a-f]{40}\""

  - it: renders the admin user with a bcrypt password hash and domain email
    template: casdoor/configmap.yaml
    asserts:
      - matchRegex:
          path: data["init_data.json"]
          pattern: "\"name\":\\s*\"root\""
      - matchRegex:
          path: data["init_data.json"]
          pattern: "\"password\":\\s*\"\\$2[aby]\\$10\\$[A-Za-z0-9./]{53}\""
      - matchRegex:
          path: data["init_data.json"]
          pattern: "\"email\":\\s*\"root@example\\.com\""

  - it: renders the GitLab provider from the web oauth issuer
    template: casdoor/configmap.yaml
    asserts:
      - matchRegex:
          path: data["init_data.json"]
          pattern: "\"customAuthUrl\":\\s*\"https://gitlab\\.example\\.com/oauth/authorize\""
      - matchRegex:
          path: data["init_data.json"]
          pattern: "\"customTokenUrl\":\\s*\"https://gitlab\\.example\\.com/oauth/token\""
      - matchRegex:
          path: data["init_data.json"]
          pattern: "\"clientId\":\\s*\"gitlab-client-id\""

  - it: embeds the casdoor database update SQL file
    template: casdoor/configmap.yaml
    asserts:
      - isNotNullOrEmpty:
          path: data["1768547229_casdoor_update_conf.sql"]

  - it: renders nothing in built-in mode
    template: casdoor/configmap.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
