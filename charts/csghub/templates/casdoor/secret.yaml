{{- $service := include "common.service" (dict "ctx" . "service" "casdoor") | fromYaml }}
{{- $serviceName := include "common.names.custom" (list . $service.name) }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace (printf "%s-init" $serviceName) }}
{{- $existingData := ($existingSecret.data) | default dict }}
{{- $legacyCertName := printf "%s-certs" $serviceName }}
{{- $legacyCertData := (lookup "v1" "Secret" .Release.Namespace $legacyCertName).data | default dict }}
{{- $storedCrt := dig "tls.crt" "" $existingData }}
{{- if not $storedCrt }}{{- $storedCrt = dig "tls.crt" "" $legacyCertData }}{{- end }}
{{- $storedKey := dig "tls.key" "" $existingData }}
{{- if not $storedKey }}{{- $storedKey = dig "tls.key" "" $legacyCertData }}{{- end }}
{{- $ca := genCA "csghub-casdoor-ca" 36500 }}
{{- $caCert := $ca.Cert }}
{{- $caKey := $ca.Key }}
{{- if $storedCrt }}{{- $caCert = $storedCrt | b64dec }}{{- end }}
{{- if $storedKey }}{{- $caKey = $storedKey | b64dec }}{{- end }}
{{- $defaultUser := $service.admin.name | default "root" }}
{{- $defaultPass := $service.admin.password | default (include "common.secret.password" (list . (printf "%s.password" $service.name) 32)) }}
{{- $defaultHtpasswd := htpasswd $defaultUser $defaultPass | trimPrefix (printf "%s:" $defaultUser) }}
{{- $storedUser := dig "INIT_ADMIN_USER" "" $existingData | b64dec }}
{{- $storedPass := dig "INIT_ADMIN_PASSWORD" "" $existingData | b64dec }}
{{- $storedHtpasswd := dig "INIT_ADMIN_HTPASSWD" "" $existingData | b64dec }}
{{- if $storedUser }}{{- $defaultUser = $storedUser }}{{- end }}
{{- if $storedHtpasswd }}{{- $defaultHtpasswd = $storedHtpasswd }}{{- end }}
{{- $adminClientID := include "common.secret.password" (list . "casdoor.Admin.clientId" 20) }}
{{- $adminClientSecret := include "common.secret.password" (list . "casdoor.Admin.clientSecret" 40) }}
{{- $storedAdminClientID := dig "CASDOOR_ADMIN_CLIENT_ID" "" $existingData | b64dec }}
{{- $storedAdminClientSecret := dig "CASDOOR_ADMIN_CLIENT_SECRET" "" $existingData | b64dec }}
{{- if $storedAdminClientID }}{{- $adminClientID = $storedAdminClientID }}{{- end }}
{{- if $storedAdminClientSecret }}{{- $adminClientSecret = $storedAdminClientSecret }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-init" $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/service: {{ $service.name }}
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  INIT_ADMIN_USER: {{ $defaultUser | b64enc | quote }}
  INIT_ADMIN_PASSWORD: {{ $storedPass | default $defaultPass | b64enc | quote }}
  INIT_ADMIN_HTPASSWD: {{ $storedHtpasswd | default $defaultHtpasswd | b64enc | quote }}
  CASDOOR_ADMIN_CLIENT_ID: {{ $adminClientID | b64enc | quote }}
  CASDOOR_ADMIN_CLIENT_SECRET: {{ $adminClientSecret | b64enc | quote }}
  tls.crt: {{ $caCert | b64enc | quote }}
  tls.key: {{ $caKey | b64enc | quote }}
