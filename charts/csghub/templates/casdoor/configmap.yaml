{{- $service := include "common.service" (dict "ctx" . "service" "casdoor") | fromYaml }}
{{- $serviceName := include "common.names.custom" (list . $service.name) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/service: {{ $service.name }}
    {{- include "common.labels" . | nindent 4 }}
data:
  app.conf: |
    appname = casdoor
    httpport = 8000
    runmode = prod
    copyrequestbody = true
    driverName = postgres
    dataSourceName = {{ include "csghub.postgresql.dsn" (dict "ctx" . "service" $service) | quote }}
    dbName =
    tableNamePrefix =
    showSql = false
    redisEndpoint =
    defaultStorageProvider =
    isCloudIntranet = false
    authState = "casdoor"
    socks5Proxy = "127.0.0.1:10808"
    verificationCodeTimeout = 10
    initScore = 0
    logPostOnly = true
    origin = {{ include "common.endpoint.casdoor" . | quote }}
    originFrontend =
    staticBaseUrl = "https://cdn.casbin.org"
    isDemoMode = false
    batchSize = 100
    enableGzip = true
    ldapServerPort = 389
    radiusServerPort = 1812
    radiusSecret = "secret"
    quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
    logConfig = {"filename": "/dev/stdout", "maxdays":99999, "perm":"0770"}
    initDataFile = "/conf-secrets/init_data.json"
    initDataNewOnly = true
    frontendBaseDir = "../cc_0"
    enableErrorMask = true
  {{- range $path, $_ := .Files.Glob "scripts/*_casdoor_*.sql" }}
  {{ base $path }}: |
  {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
