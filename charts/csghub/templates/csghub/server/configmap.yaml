{{- $service := include "common.service" (dict "ctx" . "service" "server") | fromYaml }}
{{- $serviceName := include "common.names.custom" (list . $service.name) }}
{{- $casdoorSvc := include "common.service" (dict "ctx" . "service" "casdoor") | fromYaml }}
{{- $casdoorDb := (include "common.postgresql.config" (dict "ctx" . "service" $casdoorSvc) | fromYaml).database }}
{{- $serverUser := (include "common.postgresql.config" (dict "ctx" . "service" $service) | fromYaml).user }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/service: {{ $service.name }}
    {{- include "common.labels" . | nindent 4 }}
data:
{{- $currentScope := . }}
{{- range $path, $_ := .Files.Glob "scripts/server/*.sql" }}
{{- with $currentScope }}
{{- base $path | nindent 2 }}: |
{{- .Files.Get $path | replace "__CASDOOR_DB__" $casdoorDb | replace "__SERVER_USER__" $serverUser | nindent 4 }}
{{- end }}
{{- end }}
