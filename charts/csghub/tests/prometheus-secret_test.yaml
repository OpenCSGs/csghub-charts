# Test suite for the Prometheus gateway auth Secret.
#
# The Secret holds the htpasswd file that guards the prometheus gateway. It
# renders only when an htpasswd value is configured for prometheus.

suite: Test Prometheus Secret
templates:
  - prometheus/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders nothing without a configured htpasswd
    template: prometheus/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: encodes the configured htpasswd
    template: prometheus/secret.yaml
    set:
      prometheus:
        gatewayAuth:
          htpasswd: "prom:$2y$10$abcdefghijklmnopqrstuvwx"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-prometheus"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: type
          value: "Opaque"
      - equal:
          decodeBase64: true
          path: data[".htpasswd"]
          value: "prom:$2y$10$abcdefghijklmnopqrstuvwx"
