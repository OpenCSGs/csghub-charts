# Test suite for the CSGHub Registry Secret.
#
# The Secret holds the registry htpasswd credentials and the htpasswd entry
# itself. The password is non-deterministic and matched by regex. It renders
# only when the built-in registry is enabled.

suite: Test Registry Secret
templates:
  - registry/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Secret metadata with the keep annotation
    template: registry/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-registry"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "registry"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: encodes the registry user, generated password and htpasswd entry
    template: registry/secret.yaml
    asserts:
      - equal:
          decodeBase64: true
          path: data.REGISTRY_USERNAME
          value: "registry"
      - matchRegex:
          decodeBase64: true
          path: data.REGISTRY_PASSWORD
          pattern: "^[A-Za-z0-9+/]{32}$"
      - matchRegex:
          decodeBase64: true
          path: data.htpasswd
          pattern: "^[A-Za-z0-9.]+:\\$2[aby]\\$10\\$[A-Za-z0-9./]{53}$"

  - it: renders nothing when the built-in registry is disabled
    template: registry/secret.yaml
    set:
      global:
        registry:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
