# Test suite for the CSGHub DataViewer Deployment.
#
# The Deployment runs the dataviewer module of the server image. It always
# renders because the built-in dataviewer has no enable switch.

suite: Test DataViewer Deployment
templates:
  - csghub/dataviewer/deployment.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Deployment metadata and spec defaults
    template: csghub/dataviewer/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: "csghub-dataviewer"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "dataviewer"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/service"]
          value: "dataviewer"

  - it: runs the dataviewer launch command from the ee server image
    template: csghub/dataviewer/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "dataviewer"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/csghub-server:v2.4.0-ee"
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/starhub-bin/starhub", "dataviewer", "launch", "-l", "info"]
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8093
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: "dataviewer"
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: csghub-core
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 8093

  - it: waits for the server in the init container
    template: csghub/dataviewer/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "wait-for-server"

  - it: overrides the image registry when registryPolicy is force
    template: csghub/dataviewer/deployment.yaml
    set:
      global:
        image:
          registryPolicy: force
          registry: "opencsg-registry.cn-beijing.cr.aliyuncs.com"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/csghub-server:v2.4.0-ee"
