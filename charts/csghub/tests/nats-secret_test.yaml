# Test suite for the CSGHub NATS Secret.
#
# The Secret holds the natsadmin credentials that nats-server.conf embeds. The
# root password is non-deterministic and matched by regex. It is always
# rendered because the built-in nats has no enable switch.

suite: Test NATS Secret
templates:
  - nats/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Secret metadata with the keep annotation
    template: nats/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-nats"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "nats"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: encodes the natsadmin user and a generated password
    template: nats/secret.yaml
    asserts:
      - equal:
          decodeBase64: true
          path: data.NATS_USERNAME
          value: "natsadmin"
      - matchRegex:
          decodeBase64: true
          path: data.NATS_PASSWORD
          pattern: "^[A-Za-z0-9+/]{32}$"
