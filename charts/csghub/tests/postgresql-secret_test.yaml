# Test suite for the CSGHub PostgreSQL Secret.
#
# The Secret holds the postgres superuser credentials and the comma-separated
# database list. The password is non-deterministic and matched by regex.

suite: Test PostgreSQL Secret
templates:
  - postgresql/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Secret metadata with the keep annotation
    template: postgresql/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-postgresql"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "postgresql"

  - it: encodes the superuser and the generated password
    template: postgresql/secret.yaml
    asserts:
      - equal:
          decodeBase64: true
          path: data.POSTGRES_USER
          value: "csghub"
      - matchRegex:
          path: data.POSTGRES_PASSWORD
          pattern: "^[A-Za-z0-9+/=]{44}$"

  - it: encodes the default database list
    template: postgresql/secret.yaml
    asserts:
      - matchRegex:
          decodeBase64: true
          path: data.POSTGRES_MULTIPLE_DATABASES
          pattern: "csghub_casdoor,csghub_temporal,csghub_server,csghub_portal,csghub_dataflow,csghub_label_studio,csghub_csgship,csghub_xnet,csghub_agenticflow,csghub_superset"

  - it: encodes a custom database list when set
    template: postgresql/secret.yaml
    set:
      postgresql:
        databases:
          - db1
          - db2
    asserts:
      - matchRegex:
          decodeBase64: true
          path: data.POSTGRES_MULTIPLE_DATABASES
          pattern: "db1,db2"
