# Test suite for the Prometheus SecurityPolicy.
#
# The SecurityPolicy attaches basic auth to the prometheus HTTPRoute. It
# renders only when prometheus gateway auth is enabled on an envoyproxy
# controller.

suite: Test Prometheus SecurityPolicy
templates:
  - prometheus/securitypolicy.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders nothing when gateway auth is disabled
    template: prometheus/securitypolicy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: attaches basic auth to the prometheus HTTPRoute
    template: prometheus/securitypolicy.yaml
    set:
      prometheus:
        gatewayAuth:
          enabled: true
    asserts:
      - isKind:
          of: SecurityPolicy
      - equal:
          path: metadata.name
          value: "csghub-prometheus"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: spec.targetRef.group
          value: "gateway.networking.k8s.io"
      - equal:
          path: spec.targetRef.kind
          value: "HTTPRoute"
      - equal:
          path: spec.targetRef.name
          value: "csghub-prometheus"
      - equal:
          path: spec.basicAuth.users.name
          value: "csghub-prometheus"
      - equal:
          path: spec.basicAuth.users.namespace
          value: "csghub"
      - equal:
          path: spec.basicAuth.forwardUsernameHeader
          value: "X-Forwarded-User"

  - it: renders nothing for a non-envoyproxy controller
    template: prometheus/securitypolicy.yaml
    set:
      prometheus:
        gatewayAuth:
          enabled: true
      global:
        gateway:
          controllerName: istio.io/gateway-controller
    asserts:
      - hasDocuments:
          count: 0
