# Test suite for the Prometheus HTTPRoute.
#
# The HTTPRoute exposes the prometheus gateway hostname through the listeners
# gateway, with a CORS filter for the CSGHub console. It renders only when
# prometheus gateway auth is enabled.

suite: Test Prometheus HTTPRoute
templates:
  - prometheus/httproutes.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders nothing when gateway auth is disabled
    template: prometheus/httproutes.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: exposes the prometheus hostname through the https listeners
    template: prometheus/httproutes.yaml
    set:
      prometheus:
        gatewayAuth:
          enabled: true
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: "csghub-prometheus"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "prometheus"
      - equal:
          path: spec.parentRefs[0].name
          value: "listeners"
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "https"
      - equal:
          path: spec.hostnames[0]
          value: "prometheus.example.com"
      - equal:
          path: spec.rules[0].matches[0].path.type
          value: "PathPrefix"
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: "/"
      - equal:
          path: spec.rules[0].filters[0].type
          value: "CORS"
      - equal:
          path: spec.rules[0].filters[0].cors.allowOrigins[0]
          value: "https://csghub.example.com"
      - equal:
          path: spec.rules[0].filters[0].cors.allowCredentials
          value: true
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: "csghub-prometheus-server"
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 80
      - equal:
          path: spec.rules[0].timeouts.request
          value: "60s"
