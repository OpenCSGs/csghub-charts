# Test suite for the gitlab-shell chart-managed SSH host key Secret.
#
# Replaces the previous init Job + init ConfigMap generation flow. Secret
# contents are non-deterministic (genPrivateKey), so the key fields are
# matched by their base64-encoded PEM shape rather than exact strings.

suite: Test GitLab Shell Secret
templates:
  - gitlab-shell/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Secret metadata, labels and keep annotation
    template: gitlab-shell/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-ssh-keys"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "gitlab-shell"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: includes rsa, ecdsa and ed25519 host keys as base64 PEM
    template: gitlab-shell/secret.yaml
    asserts:
      - matchRegex:
          path: data["ssh_host_rsa_key"]
          pattern: "^LS0tLS1CRUdJTi"
      - matchRegex:
          path: data["ssh_host_ecdsa_key"]
          pattern: "^LS0tLS1CRUdJTi"
      - matchRegex:
          path: data["ssh_host_ed25519_key"]
          pattern: "^LS0tLS1CRUdJTi"
