# Test suite for the CSGHub GitLab Shell RBAC.
#
# The RBAC file holds three hook documents: a ServiceAccount, a Role scoped to
# the gitlab-shell Secret, and a RoleBinding. They render only when rbac.create
# is enabled.

suite: Test GitLab Shell RBAC
templates:
  - gitlab-shell/rbac.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the ServiceAccount with hook annotations
    template: gitlab-shell/rbac.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: "csghub-gitlab-shell"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "gitlab-shell"
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"

  - it: renders the Role scoped to the gitlab-shell Secret
    template: gitlab-shell/rbac.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: "csghub-gitlab-shell"
      - contains:
          path: rules[0].resources
          content: "secrets"
      - contains:
          path: rules[0].verbs
          content: "get"
      - contains:
          path: rules[0].verbs
          content: "patch"
      - contains:
          path: rules[0].verbs
          content: "create"

  - it: renders the RoleBinding to the ServiceAccount
    template: gitlab-shell/rbac.yaml
    documentIndex: 2
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.name
          value: "csghub-gitlab-shell"
      - equal:
          path: subjects[0].kind
          value: "ServiceAccount"
      - equal:
          path: subjects[0].name
          value: "csghub-gitlab-shell"
      - equal:
          path: roleRef.kind
          value: "Role"
      - equal:
          path: roleRef.name
          value: "csghub-gitlab-shell"

  - it: renders nothing when rbac.create is disabled
    template: gitlab-shell/rbac.yaml
    set:
      gitlabShell:
        rbac:
          create: false
    asserts:
      - hasDocuments:
          count: 0
