# Test suite for the CSGHub GitLab Shell ConfigMaps.
#
# The ConfigMap file holds two documents: the gitlab-shell config that embeds
# the Gitaly token (non-deterministic, matched by regex) and, when RBAC is
# enabled, an init ConfigMap with the ssh host key generation script.

suite: Test GitLab Shell ConfigMap
templates:
  - gitlab-shell/configmap.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the gitlab-shell ConfigMap with the gitaly token and server URL
    template: gitlab-shell/configmap.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: "csghub-gitlab-shell"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "gitlab-shell"
      - matchRegex:
          path: data[".gitaly_token"]
          pattern: "^[A-Za-z0-9+/]{32}$"
      - matchRegex:
          path: data["config.yml"]
          pattern: 'gitlab_url: "http://csghub-server:8080"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'auth_file: "/home/git/.ssh/authorized_keys"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'listen: "\[::\]:22"'

  - it: renders the init ConfigMap with the ssh key generation script
    template: gitlab-shell/configmap.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: "csghub-gitlab-shell-init"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "gitlab-shell"
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: "pre-install, pre-upgrade, post-delete"
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-5"
      - isNotNullOrEmpty:
          path: data["generate_ssh_keys.sh"]
