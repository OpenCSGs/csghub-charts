# Test suite for the CSGHub GitLab Shell ConfigMap.
#
# The ConfigMap embeds the Gitaly token (non-deterministic, matched by regex)
# and the gitlab-shell configuration including the kex_algorithm list and
# host key file paths.

suite: Test GitLab Shell ConfigMap
templates:
  - gitlab-shell/configmap.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the gitlab-shell ConfigMap with the gitaly token and server URL
    template: gitlab-shell/configmap.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: "csghub-gitlab-shell"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "gitlab-shell"
      - matchRegex:
          path: data[".gitaly_token"]
          pattern: "^[A-Za-z0-9+/]{32}$"
      - matchRegex:
          path: data["config.yml"]
          pattern: 'gitlab_url: "http://csghub-server:8080"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'auth_file: "/home/git/.ssh/authorized_keys"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'listen: "\[::\]:22"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'secret: "signing-key"'

  - it: uses the external gitaly jwt secret when built-in gitaly is disabled
    template: gitlab-shell/configmap.yaml
    documentIndex: 0
    set:
      global:
        gitaly:
          enabled: false
          external:
            host: "10.6.0.13"
            port: 8076
            token: "Gitaly2025"
            storage: "gitaly"
            jwtSecret: "GitalyJWT2025"
    asserts:
      - matchRegex:
          path: data["config.yml"]
          pattern: 'secret: "GitalyJWT2025"'
