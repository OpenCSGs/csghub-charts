# Test suite for the Dataflow ConfigMap when bundled with CSGHub.
#
# With global.chartContext.isBuiltIn the dataflow points its csghub endpoint at
# the bundled console instead of the standalone externalUrl. This branch cannot
# be tested when rendering the dataflow chart standalone, so it is verified
# here from the csghub umbrella.

suite: Test Dataflow ConfigMap (builtin)
templates:
  - charts/dataflow/templates/dataflow/configmap.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the ConfigMap metadata with the dataflow labels
    template: charts/dataflow/templates/dataflow/configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: "csghub-dataflow"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "dataflow"

  - it: points the csghub and label studio endpoints at the console
    template: charts/dataflow/templates/dataflow/configmap.yaml
    asserts:
      - equal:
          path: data.CSGHUB_ENDPOINT
          value: "https://csghub.example.com"
      - equal:
          path: data.STUDIO_JUMP_URL
          value: "https://csghub.example.com/-/label-studio"

  - it: encodes the bundled postgresql database
    template: charts/dataflow/templates/dataflow/configmap.yaml
    asserts:
      - equal:
          path: data.DATABASE_HOSTNAME
          value: "csghub-postgresql"
      - equal:
          path: data.DATABASE_PORT
          value: "5432"
      - equal:
          path: data.DATABASE_DB
          value: "csghub_dataflow"
      - equal:
          path: data.DATABASE_USERNAME
          value: "csghub"
      - matchRegex:
          path: data.DATABASE_PASSWORD
          pattern: "^[A-Za-z0-9+/]{32}$"
      - equal:
          path: data.CSGHUB_DATAFLOW_TEMPLATE_IMAGE
          value: "opencsghq/dataflow:v2.4.0-argo"
