# Test suite for the CSGHub MinIO Service.
#
# The MinIO Service is a headless ClusterIP service exposing port 9000, with an
# optional console port when the console is enabled.

suite: Test MinIO Service
templates:
  - minio/service.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the headless Service metadata with standard labels
    template: minio/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: "csghub-minio"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "minio"

  - it: renders the single port 9000 with a None cluster IP
    template: minio/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.clusterIP
          value: "None"
      - equal:
          path: spec.ports[0].port
          value: 9000
      - equal:
          path: spec.ports[0].targetPort
          value: 9000
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "minio"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "minio"

  - it: appends the console port when the console is enabled
    template: minio/service.yaml
    set:
      minio:
        console:
          enabled: true
    asserts:
      - equal:
          path: spec.ports[1].port
          value: 9001
      - equal:
          path: spec.ports[1].targetPort
          value: 9001
      - equal:
          path: spec.ports[1].name
          value: "minio-console"

  - it: renders nothing when the built-in object storage is disabled
    template: minio/service.yaml
    set:
      global:
        objectStore:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
