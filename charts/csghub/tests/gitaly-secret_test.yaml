# Test suite for the CSGHub Gitaly Secret.
#
# The Secret holds the Gitaly auth token shared with gitlab-shell. The token is
# non-deterministic and matched by regex. It renders only when the built-in
# gitaly is enabled.

suite: Test Gitaly Secret
templates:
  - gitaly/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Secret metadata with the keep annotation
    template: gitaly/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-gitaly"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "gitaly"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: encodes a generated gitaly token
    template: gitaly/secret.yaml
    asserts:
      - matchRegex:
          decodeBase64: true
          path: data.GITALY_TOKEN
          pattern: "^[A-Za-z0-9+/]{32}$"

  - it: renders nothing when the built-in gitaly is disabled
    template: gitaly/secret.yaml
    set:
      global:
        gitaly:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
