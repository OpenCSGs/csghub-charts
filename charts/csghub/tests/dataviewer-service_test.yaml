# Test suite for the CSGHub DataViewer Service.
#
# The DataViewer Service exposes the dataviewer port 8093.

suite: Test DataViewer Service
templates:
  - csghub/dataviewer/service.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Service metadata with standard labels
    template: csghub/dataviewer/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: "csghub-dataviewer"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "dataviewer"

  - it: renders the dataviewer port 8093
    template: csghub/dataviewer/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.ports[0].port
          value: 8093
      - equal:
          path: spec.ports[0].targetPort
          value: 8093
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "dataviewer"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "dataviewer"
