# Test suite for the CSGHub XNet Service.
#
# The XNet Service exposes the xnet port 8097.

suite: Test XNet Service
templates:
  - xnet/service.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Service metadata with standard labels
    template: xnet/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: "csghub-xnet"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "xnet"

  - it: renders the xnet port 8097
    template: xnet/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.ports[0].port
          value: 8097
      - equal:
          path: spec.ports[0].targetPort
          value: 8097
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "xnet"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "xnet"
