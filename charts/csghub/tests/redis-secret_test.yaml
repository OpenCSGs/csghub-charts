# Test suite for the CSGHub Redis Secret.
#
# The Secret holds the redis password and renders only when requirePass is
# enabled. The password is non-deterministic and matched by regex.

suite: Test Redis Secret
templates:
  - redis/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders nothing when requirePass is false
    template: redis/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Secret with the keep annotation when requirePass is true
    template: redis/secret.yaml
    set:
      redis:
        requirePass: true
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-redis"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "redis"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: encodes a generated password
    template: redis/secret.yaml
    set:
      redis:
        requirePass: true
    asserts:
      - matchRegex:
          decodeBase64: true
          path: data.REDIS_PASSWD
          pattern: "^[A-Za-z0-9+/]{32}$"

  - it: renders nothing when the built-in Redis is disabled
    template: redis/secret.yaml
    set:
      redis:
        requirePass: true
      global:
        redis:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
