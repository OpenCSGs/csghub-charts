# Test suite for the CSGHub PostgreSQL StatefulSet.
#
# The StatefulSet runs postgres with the runtime config, sources the postgres
# Secret and provisions a volumeClaimTemplate for the data.

suite: Test PostgreSQL StatefulSet
templates:
  - postgresql/statefulset.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the StatefulSet metadata and spec defaults
    template: postgresql/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: "csghub-postgresql"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "postgresql"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
      - equal:
          path: spec.serviceName
          value: "csghub-postgresql"
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/service"]
          value: "postgresql"

  - it: runs postgres with the runtime config file
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "postgresql"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/postgres:15.18"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "IfNotPresent"
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["-c", "config_file=/etc/postgresql/runtime.conf"]

  - it: provisions the default data volume claim template
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: "ReadWriteOnce"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "50Gi"

  - it: overrides persistence and node selector when set
    template: postgresql/statefulset.yaml
    set:
      global:
        image:
          registryPolicy: force
          registry: "opencsg-registry.cn-beijing.cr.aliyuncs.com"
      postgresql:
        persistence:
          storageClass: "hostPath"
          accessModes:
            - ReadWriteOnce
          size: "20Gi"
        nodeSelector:
          diskType: ssd
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/postgres:15.18"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: "hostPath"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "20Gi"
      - equal:
          path: spec.template.spec.nodeSelector.diskType
          value: "ssd"

  - it: renders nothing when the built-in PostgreSQL is disabled
    template: postgresql/statefulset.yaml
    set:
      global:
        postgresql:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
