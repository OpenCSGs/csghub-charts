# Test suite for the CSGHub MinIO Secret.
#
# The Secret holds the MinIO root credentials, region, bucket list and the
# console redirect. The root password is non-deterministic and matched by
# regex. It renders only when the built-in object storage is enabled.

suite: Test MinIO Secret
templates:
  - minio/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Secret metadata with the keep annotation
    template: minio/secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-minio"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "minio"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: encodes the root user, region and a generated password
    template: minio/secret.yaml
    asserts:
      - equal:
          decodeBase64: true
          path: data.MINIO_ROOT_USER
          value: "minio"
      - matchRegex:
          decodeBase64: true
          path: data.MINIO_ROOT_PASSWORD
          pattern: "^[A-Za-z0-9+/]{32}$"
      - equal:
          decodeBase64: true
          path: data.MINIO_DEFAULT_REGION
          value: "cn-north-1"

  - it: encodes the default bucket list
    template: minio/secret.yaml
    asserts:
      - matchRegex:
          decodeBase64: true
          path: data.MINIO_DEFAULT_BUCKETS
          pattern: "csghub-registry:none,csghub-billing:none,csghub-server:none,csghub-portal:none,csghub-portal-public:download,csghub-runner:none,csghub-xnet:none,csghub-llmlog:none"

  - it: encodes the minio endpoint and console redirect
    template: minio/secret.yaml
    asserts:
      - equal:
          decodeBase64: true
          path: data.MINIO_SERVER_URL
          value: "https://minio.example.com"
      - equal:
          decodeBase64: true
          path: data.MINIO_BROWSER_REDIRECT
          value: "true"
      - equal:
          decodeBase64: true
          path: data.MINIO_BROWSER_REDIRECT_URL
          value: "https://minio.example.com/console/"

  - it: renders nothing when the built-in object storage is disabled
    template: minio/secret.yaml
    set:
      global:
        objectStore:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
