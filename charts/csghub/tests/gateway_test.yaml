# Test suite for the CSGHub Gateway resources.
#
# The template renders a GatewayClass and a Gateway in one file. helm-unittest
# preserves file order, so the GatewayClass is document 0 and the Gateway is
# document 1; tests select documents via documentIndex.
#
# With the envoyproxy controller, the Gateway references the csghub-envoy-proxy
# EnvoyProxy via infrastructure.parametersRef. The https listener references
# the global TLS secret plus any distinct casdoor/minio/portal TLS secrets.

suite: Test Gateway Resources
templates:
  - gateway.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  ## ------------------------------------------------------------------
  ## Gateway
  ## ------------------------------------------------------------------
  - it: renders the Gateway with http, https and gitssh listeners
    template: gateway.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Gateway
      - equal:
          path: metadata.name
          value: "listeners"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: spec.gatewayClassName
          value: "csghub-gateway"
      - equal:
          path: spec.infrastructure.parametersRef.group
          value: "gateway.envoyproxy.io"
      - equal:
          path: spec.infrastructure.parametersRef.kind
          value: "EnvoyProxy"
      - equal:
          path: spec.infrastructure.parametersRef.name
          value: "csghub-envoy-proxy"
      - equal:
          path: spec.listeners[0].name
          value: "http"
      - equal:
          path: spec.listeners[0].protocol
          value: "HTTP"
      - equal:
          path: spec.listeners[0].port
          value: 80
      - equal:
          path: spec.listeners[1].name
          value: "https"
      - equal:
          path: spec.listeners[1].protocol
          value: "HTTPS"
      - equal:
          path: spec.listeners[1].port
          value: 443
      - equal:
          path: spec.listeners[2].name
          value: "gitssh"
      - equal:
          path: spec.listeners[2].protocol
          value: "TCP"
      - equal:
          path: spec.listeners[2].port
          value: 22

  - it: references the global TLS secret on the https listener
    template: gateway.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: spec.listeners[1].tls.mode
          value: "Terminate"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].kind
          value: "Secret"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].name
          value: "csghub-tls"

  - it: appends distinct casdoor, minio and portal TLS secrets
    template: gateway.yaml
    documentIndex: 1
    set:
      casdoor:
        gateway:
          tls:
            secretName: "casdoor-tls"
      minio:
        gateway:
          tls:
            secretName: "minio-tls"
      portal:
        gateway:
          tls:
            secretName: "portal-tls"
    asserts:
      - equal:
          path: spec.listeners[1].tls.certificateRefs[0].name
          value: "csghub-tls"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[1].name
          value: "casdoor-tls"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[2].name
          value: "minio-tls"
      - equal:
          path: spec.listeners[1].tls.certificateRefs[3].name
          value: "portal-tls"

  - it: omits the https listener when TLS is disabled
    template: gateway.yaml
    documentIndex: 1
    set:
      global:
        gateway:
          tls:
            enabled: false
            secretName: ""
    asserts:
      - equal:
          path: spec.listeners[0].name
          value: "http"
      - equal:
          path: spec.listeners[1].name
          value: "gitssh"
      - notExists:
          path: spec.listeners[2]

  - it: renders the gitssh listener with a custom ssh port
    template: gateway.yaml
    documentIndex: 1
    set:
      server:
        gitlabShell:
          sshPort: 222
    asserts:
      - equal:
          path: spec.listeners[2].name
          value: "gitssh"
      - equal:
          path: spec.listeners[2].port
          value: 222
      - equal:
          path: spec.listeners[2].allowedRoutes.kinds[0].kind
          value: "TCPRoute"

  - it: omits the EnvoyProxy parametersRef for a non-envoyproxy controller
    template: gateway.yaml
    documentIndex: 1
    set:
      global:
        gateway:
          controllerName: istio.io/gateway-controller
    asserts:
      - notExists:
          path: spec.infrastructure

  ## ------------------------------------------------------------------
  ## GatewayClass
  ## ------------------------------------------------------------------
  - it: renders the GatewayClass with the envoyproxy controller
    template: gateway.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: GatewayClass
      - equal:
          path: metadata.name
          value: "csghub-gateway"
      - equal:
          path: spec.controllerName
          value: "gateway.envoyproxy.io/gatewayclass-controller"
