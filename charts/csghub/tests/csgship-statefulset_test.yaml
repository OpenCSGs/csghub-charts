# Test suite for the CSGShip web StatefulSet when bundled with CSGHub.
#
# With global.chartContext.isBuiltIn the csgship web additionally mounts the
# bundled nats secret for NATS credentials. This branch cannot be tested when
# rendering the csgship chart standalone, so it is verified here from the
# csghub umbrella.

suite: Test CSGShip Web StatefulSet (builtin)
templates:
  - charts/csgship/templates/web/statefulset.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
set:
  csgship:
    enabled: true
tests:
  - it: renders the StatefulSet metadata and spec defaults
    template: charts/csgship/templates/web/statefulset.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: metadata.name
          value: "csghub-csgship"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "csgship"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.serviceName
          value: "csghub-csgship"
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/service"]
          value: "csgship"

  - it: runs the csgship web container with the configmap and nats secret
    template: charts/csgship/templates/web/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "csgship"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/csgship-web:v0.4.0"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8000
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: "csghub-csgship"
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: "csghub-nats"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 8000

  - it: provisions the data volume claim
    template: charts/csgship/templates/web/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: "data"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: "ReadWriteOnce"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "10Gi"
