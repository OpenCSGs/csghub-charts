# Test suite for the CSGHub NATS ConfigMap.
#
# The ConfigMap holds nats-server.conf with the client port, HTTP monitoring
# port, jetstream storage and an authorization block whose password is a random
# value that must match the Secret rendered in the same release.

suite: Test NATS ConfigMap
templates:
  - nats/configmap.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the ConfigMap metadata with the nats service labels
    template: nats/configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: "csghub-nats"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "nats"

  - it: configures the client port, monitoring port and jetstream
    template: nats/configmap.yaml
    asserts:
      - matchRegex:
          path: data["nats-server.conf"]
          pattern: "(?m)^\\s*port: 4222\\s*$"
      - matchRegex:
          path: data["nats-server.conf"]
          pattern: "(?m)^\\s*monitor_port: 8222\\s*$"
      - matchRegex:
          path: data["nats-server.conf"]
          pattern: "(?m)^\\s*jetstream: enabled\\s*$"
      - matchRegex:
          path: data["nats-server.conf"]
          pattern: "(?m)^\\s*store_dir: /data/jetstream\\s*$"

  - it: writes the natsadmin user with a generated password
    template: nats/configmap.yaml
    asserts:
      - matchRegex:
          path: data["nats-server.conf"]
          pattern: 'user: "natsadmin",'
      - matchRegex:
          path: data["nats-server.conf"]
          pattern: 'password: "[A-Za-z0-9+/]{32}",'
      - matchRegex:
          path: data["nats-server.conf"]
          pattern: "permissions: \\$ADMIN"
