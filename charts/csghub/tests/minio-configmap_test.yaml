# Test suite for the CSGHub MinIO ConfigMap.
#
# The ConfigMap embeds the scripts/*_minio_*.sh init scripts. It renders only
# when the built-in object storage is enabled.

suite: Test MinIO ConfigMap
templates:
  - minio/configmap.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the ConfigMap metadata with the minio service label
    template: minio/configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: "csghub-minio"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "minio"
      - isNotNullOrEmpty:
          path: data

  - it: renders nothing when the built-in object storage is disabled
    template: minio/configmap.yaml
    set:
      global:
        objectStore:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
