# Test suite for the Loki gateway auth Secret.
#
# The Secret holds the htpasswd file that guards the loki gateway. It renders
# only when an htpasswd value is configured for loki.

suite: Test Loki Secret
templates:
  - loki/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders nothing without a configured htpasswd
    template: loki/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: encodes the configured htpasswd
    template: loki/secret.yaml
    set:
      loki:
        gatewayAuth:
          htpasswd: "loki:$2y$10$abcdefghijklmnopqrstuvwx"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-loki"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: type
          value: "Opaque"
      - equal:
          decodeBase64: true
          path: data[".htpasswd"]
          value: "loki:$2y$10$abcdefghijklmnopqrstuvwx"
