# Test suite for the CSGHub User Service.
#
# The User Service exposes the user port 8080.

suite: Test User Service
templates:
  - csghub/user/service.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Service metadata with standard labels
    template: csghub/user/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: "csghub-user"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "user"

  - it: renders the user port 8080
    template: csghub/user/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: 8080
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "user"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "user"
