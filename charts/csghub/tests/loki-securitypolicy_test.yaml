# Test suite for the Loki SecurityPolicy.
#
# The SecurityPolicy attaches basic auth to the loki HTTPRoute. It renders only
# when loki gateway auth is enabled on an envoyproxy controller.

suite: Test Loki SecurityPolicy
templates:
  - loki/securitypolicy.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders nothing when gateway auth is disabled
    template: loki/securitypolicy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: attaches basic auth to the loki HTTPRoute
    template: loki/securitypolicy.yaml
    set:
      loki:
        gatewayAuth:
          enabled: true
    asserts:
      - isKind:
          of: SecurityPolicy
      - equal:
          path: metadata.name
          value: "csghub-loki"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: spec.targetRef.group
          value: "gateway.networking.k8s.io"
      - equal:
          path: spec.targetRef.kind
          value: "HTTPRoute"
      - equal:
          path: spec.targetRef.name
          value: "csghub-loki"
      - equal:
          path: spec.basicAuth.users.name
          value: "csghub-loki"
      - equal:
          path: spec.basicAuth.users.namespace
          value: "csghub"
      - equal:
          path: spec.basicAuth.forwardUsernameHeader
          value: "X-Forwarded-User"

  - it: renders nothing for a non-envoyproxy controller
    template: loki/securitypolicy.yaml
    set:
      loki:
        gatewayAuth:
          enabled: true
      global:
        gateway:
          controllerName: istio.io/gateway-controller
    asserts:
      - hasDocuments:
          count: 0
