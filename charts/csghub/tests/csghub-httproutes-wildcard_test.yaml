# Test suite for the CSGHub wildcard HTTPRoute.
#
# The wildcard route forwards *.csghub.example.com to the rproxy service. It
# renders only when the runner uses the public domain.

suite: Test CSGHub Wildcard HTTPRoute
templates:
  - csghub/httproutes-wildcard.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the wildcard route to the rproxy
    template: csghub/httproutes-wildcard.yaml
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: "csghub-rproxy"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: spec.parentRefs[0].name
          value: "listeners"
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "https"
      - contains:
          path: spec.hostnames
          content: "*.csghub.example.com"
      - equal:
          path: spec.rules[0]
          value:
            matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: csghub-rproxy
                port: 8083
            timeouts:
              request: 60s

  - it: targets the http parent section when TLS is disabled
    template: csghub/httproutes-wildcard.yaml
    set:
      global:
        gateway:
          tls:
            enabled: false
            secretName: ""
    asserts:
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "http"

  - it: renders nothing when the runner does not use the public domain
    template: csghub/httproutes-wildcard.yaml
    set:
      runner:
        space:
          usePublicDomain: false
    asserts:
      - hasDocuments:
          count: 0
