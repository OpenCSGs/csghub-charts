# Test suite for the Runner Gateways when bundled with CSGHub.
#
# When bundled with CSGHub the runner skips the standalone GatewayClass and
# listeners Gateway because the csghub gateway already routes the public
# hostnames. It keeps the knative and knative-local Gateways for the space
# runtimes. This branch cannot be tested when rendering the runner chart
# standalone, so it is verified here from the csghub umbrella.

suite: Test Runner Gateways (builtin)
templates:
  - charts/runner/templates/gateway.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders only the two knative Gateways
    template: charts/runner/templates/gateway.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: renders the knative Gateway scoped to the runtime namespaces
    template: charts/runner/templates/gateway.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Gateway
      - equal:
          path: metadata.name
          value: "knative"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: spec.gatewayClassName
          value: "csghub-gateway"
      - equal:
          path: spec.infrastructure.parametersRef.group
          value: "gateway.envoyproxy.io"
      - equal:
          path: spec.infrastructure.parametersRef.kind
          value: "EnvoyProxy"
      - equal:
          path: spec.infrastructure.parametersRef.name
          value: "csghub-envoy-proxy-knative"
      - equal:
          path: spec.listeners[0].name
          value: "http"
      - equal:
          path: spec.listeners[0].port
          value: 80
      - equal:
          path: spec.listeners[0].allowedRoutes.namespaces.from
          value: "Selector"
      - contains:
          path: spec.listeners[0].allowedRoutes.namespaces.selector.matchExpressions[0].values
          content: "spaces"

  - it: renders the knative-local Gateway
    template: charts/runner/templates/gateway.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Gateway
      - equal:
          path: metadata.name
          value: "knative-local"
      - equal:
          path: spec.infrastructure.parametersRef.name
          value: "csghub-envoy-proxy-knative-local"
