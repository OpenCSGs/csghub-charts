# Test suite for the CSGHub MinIO HTTPRoute.
#
# The route targets the minio domain and allows CORS from the csghub domain.

suite: Test MinIO HTTPRoute
templates:
  - minio/httproutes.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the HTTPRoute metadata with the minio hostname
    template: minio/httproutes.yaml
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: "csghub-minio"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "minio"
      - equal:
          path: spec.parentRefs[0].name
          value: "listeners"
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "https"
      - contains:
          path: spec.hostnames
          content: "minio.example.com"

  - it: routes the root to the minio service with CORS from the csghub domain
    template: minio/httproutes.yaml
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: "/"
      - equal:
          path: spec.rules[0].filters[0].cors.allowOrigins[0]
          value: "https://csghub.example.com"
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: "csghub-minio"
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 9000

  - it: targets the http parent section when TLS is disabled
    template: minio/httproutes.yaml
    set:
      global:
        gateway:
          tls:
            enabled: false
            secretName: ""
    asserts:
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "http"

  - it: renders nothing when the built-in object storage is disabled
    template: minio/httproutes.yaml
    set:
      global:
        objectStore:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: adds console redirect and rewrite rules when the minio console is enabled
    template: minio/httproutes.yaml
    set:
      minio:
        console:
          enabled: true
    asserts:
      - lengthEqual:
          path: spec.rules
          count: 3
      - equal:
          path: spec.rules[1].matches[0].path.type
          value: "Exact"
      - equal:
          path: spec.rules[1].matches[0].path.value
          value: "/console"
      - equal:
          path: spec.rules[1].filters[0].type
          value: "RequestRedirect"
      - equal:
          path: spec.rules[1].filters[0].requestRedirect.path.replaceFullPath
          value: "/console/"
      - equal:
          path: spec.rules[1].filters[0].requestRedirect.statusCode
          value: 301
      - equal:
          path: spec.rules[2].matches[0].path.value
          value: "/console/"
      - equal:
          path: spec.rules[2].filters[0].type
          value: "URLRewrite"
      - equal:
          path: spec.rules[2].backendRefs[0].name
          value: "csghub-minio"
      - equal:
          path: spec.rules[2].backendRefs[0].port
          value: 9001
