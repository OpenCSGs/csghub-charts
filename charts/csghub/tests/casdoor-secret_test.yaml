# Test suite for the CSGHub casdoor Secrets.
#
# The template renders two Secrets: the init Secret with the bootstrap admin
# credentials and the TLS cert Secret. The init Secret is document 0 and the
# cert Secret is document 1. With the baseline admin name/password the
# INIT_ADMIN_USER/PASSWORD are deterministic; the htpasswd bcrypt hash and the
# admin client credentials are matched by regex.

suite: Test Casdoor Secret
templates:
  - casdoor/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the init Secret metadata with the keep annotation
    template: casdoor/secret.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-casdoor-init"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "casdoor"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: encodes the admin credentials from the baseline values
    template: casdoor/secret.yaml
    documentIndex: 0
    asserts:
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_USER
          value: "root"
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_PASSWORD
          value: "test-admin-password"
      - matchRegex:
          decodeBase64: true
          path: data.INIT_ADMIN_HTPASSWD
          pattern: "^\\$2[aby]\\$10\\$[A-Za-z0-9./]{53}$"

  - it: encodes a custom admin name and password when set
    template: casdoor/secret.yaml
    documentIndex: 0
    set:
      casdoor:
        admin:
          name: "adminUser"
          password: "adminPassword"
    asserts:
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_USER
          value: "adminUser"
      - equal:
          decodeBase64: true
          path: data.INIT_ADMIN_PASSWORD
          value: "adminPassword"
      - matchRegex:
          decodeBase64: true
          path: data.INIT_ADMIN_HTPASSWD
          pattern: "^\\$2[aby]\\$10\\$[A-Za-z0-9./]{53}$"

  - it: encodes the admin client credentials for the casdoor job
    template: casdoor/secret.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          decodeBase64: true
          path: data.CASDOOR_ADMIN_CLIENT_ID
          pattern: "^[0-9a-f]{20}$"
      - matchRegex:
          decodeBase64: true
          path: data.CASDOOR_ADMIN_CLIENT_SECRET
          pattern: "^[0-9a-f]{40}$"

  - it: renders the TLS cert Secret with the bundled certificate
    template: casdoor/secret.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-casdoor-certs"
      - equal:
          path: type
          value: "kubernetes.io/tls"
      - isNotNullOrEmpty:
          path: data["tls.crt"]
      - isNotNullOrEmpty:
          path: data["tls.key"]
