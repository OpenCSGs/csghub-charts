# Test suite for the CSGHub RProxy Service.
#
# The Service file holds the rproxy ClusterIP service and, when coredns is
# enabled, a second coredns Service document. The nginx enable switch pins the
# rproxy service ClusterIP.

suite: Test RProxy Service
templates:
  - csghub/rproxy/service.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the rproxy Service with the default port 8083
    template: csghub/rproxy/service.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: "csghub-rproxy"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "rproxy"
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.ports[0].port
          value: 8083
      - equal:
          path: spec.ports[0].targetPort
          value: 8083
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "rproxy"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "rproxy"

  - it: pins the ClusterIP and adds the nginx port when nginx is enabled
    template: csghub/rproxy/service.yaml
    set:
      rproxy:
        nginx:
          enabled: true
    asserts:
      - equal:
          path: spec.clusterIP
          value: "10.96.0.177"
      - equal:
          path: spec.ports[1].port
          value: 80
      - equal:
          path: spec.ports[1].targetPort
          value: 80
      - equal:
          path: spec.ports[1].name
          value: "rproxy-nginx"

  - it: renders the coredns Service when coredns is enabled
    template: csghub/rproxy/service.yaml
    documentIndex: 1
    set:
      rproxy:
        coredns:
          enabled: true
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: "csghub-rproxy-coredns"
      - equal:
          path: spec.clusterIP
          value: "10.96.0.176"
      - equal:
          path: spec.ports[0].port
          value: 53
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "coredns-tcp"
      - equal:
          path: spec.ports[1].port
          value: 53
      - equal:
          path: spec.ports[1].protocol
          value: "UDP"
      - equal:
          path: spec.ports[1].name
          value: "coredns-udp"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "coredns"
