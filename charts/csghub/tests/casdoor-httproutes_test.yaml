# Test suite for the CSGHub casdoor HTTPRoute.
#
# The route targets the casdoor domain and allows CORS from the csghub domain.

suite: Test Casdoor HTTPRoute
templates:
  - casdoor/httproutes.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the HTTPRoute metadata with the casdoor hostname
    template: casdoor/httproutes.yaml
    asserts:
      - isKind:
          of: HTTPRoute
      - equal:
          path: metadata.name
          value: "csghub-casdoor"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "casdoor"
      - equal:
          path: spec.parentRefs[0].name
          value: "listeners"
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "https"
      - contains:
          path: spec.hostnames
          content: "casdoor.example.com"

  - it: routes the root to the casdoor service with CORS from the csghub domain
    template: casdoor/httproutes.yaml
    asserts:
      - equal:
          path: spec.rules[0].matches[0].path.value
          value: "/"
      - equal:
          path: spec.rules[0].filters[0].type
          value: "CORS"
      - equal:
          path: spec.rules[0].filters[0].cors.allowOrigins[0]
          value: "https://csghub.example.com"
      - equal:
          path: spec.rules[0].filters[0].cors.allowCredentials
          value: true
      - equal:
          path: spec.rules[0].backendRefs[0].name
          value: "csghub-casdoor"
      - equal:
          path: spec.rules[0].backendRefs[0].port
          value: 8000
      - equal:
          path: spec.rules[0].timeouts.request
          value: 60s

  - it: targets the http parent section when TLS is disabled
    template: casdoor/httproutes.yaml
    set:
      global:
        gateway:
          tls:
            enabled: false
            secretName: ""
    asserts:
      - equal:
          path: spec.parentRefs[0].sectionName
          value: "http"
