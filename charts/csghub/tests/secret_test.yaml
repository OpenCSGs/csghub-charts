# Test suite for the CSGHub master Secret.
#
# The Secret persists the clusterID master key and the base values derived from
# it (csghub-token, agenticflow-token, jwt-signing-key, space-session-secret-key,
# superset-secret-key). Derived values are non-deterministic and matched by
# regex. The Secret carries the keep annotation so it survives helm uninstall.

suite: Test Master Secret
templates:
  - secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Secret metadata with the keep annotation
    template: secret.yaml
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-secrets"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: encodes the master key as a sha256-derived hex string
    template: secret.yaml
    asserts:
      - matchRegex:
          decodeBase64: true
          path: data.master-key
          pattern: "^[0-9a-f]{64}$"

  - it: encodes the csghub and agenticflow API tokens
    template: secret.yaml
    asserts:
      - matchRegex:
          decodeBase64: true
          path: data.csghub-token
          pattern: "^[0-9a-f]{128}$"
      - matchRegex:
          decodeBase64: true
          path: data.agenticflow-token
          pattern: "^[0-9a-f]{44}$"

  - it: encodes the jwt, session and superset signing keys
    template: secret.yaml
    asserts:
      - matchRegex:
          decodeBase64: true
          path: data.jwt-signing-key
          pattern: "^[0-9a-f]{40}$"
      - matchRegex:
          decodeBase64: true
          path: data.space-session-secret-key
          pattern: "^[0-9a-f]{40}$"
      - matchRegex:
          decodeBase64: true
          path: data.superset-secret-key
          pattern: "^[0-9a-f]{56}$"
