# Test suite for the CSGHub Temporal Secret.
#
# The Secret file holds two documents: the temporal database credentials and a
# certs Secret. The database password is non-deterministic and matched by
# regex. It always renders because the built-in temporal has no enable switch.

suite: Test Temporal Secret
templates:
  - temporal/secret.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the main Secret with the internal postgresql config
    template: temporal/secret.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-temporal"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "temporal"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: encodes the database driver and seeds
    template: temporal/secret.yaml
    documentIndex: 0
    asserts:
      - equal:
          decodeBase64: true
          path: data.DB
          value: "postgres12"
      - equal:
          decodeBase64: true
          path: data.POSTGRES_SEEDS
          value: "csghub-postgresql"
      - equal:
          decodeBase64: true
          path: data.DB_PORT
          value: "5432"
      - equal:
          decodeBase64: true
          path: data.POSTGRES_USER
          value: "csghub"
      - matchRegex:
          decodeBase64: true
          path: data.POSTGRES_PWD
          pattern: "^[A-Za-z0-9+/]{32}$"
      - equal:
          decodeBase64: true
          path: data.DBNAME
          value: "csghub_temporal"
      - equal:
          decodeBase64: true
          path: data.VISIBILITY_DBNAME
          value: "csghub_temporal_visibility"
      - equal:
          decodeBase64: true
          path: data.DEFAULT_NAMESPACE
          value: "default"
      - equal:
          decodeBase64: true
          path: data.DEFAULT_NAMESPACE_RETENTION
          value: "7d"

  - it: encodes the TLS flags when sslmode requires it
    template: temporal/secret.yaml
    documentIndex: 0
    set:
      temporal:
        postgresql:
          sslmode: "require"
    asserts:
      - equal:
          decodeBase64: true
          path: data.POSTGRES_TLS_ENABLED
          value: "true"
      - equal:
          decodeBase64: true
          path: data.SQL_TLS_ENABLED
          value: "true"

  - it: renders the certs Secret when sslmode requires it
    template: temporal/secret.yaml
    documentIndex: 1
    set:
      temporal:
        postgresql:
          sslmode: "require"
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: "csghub-temporal-certs"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"

  - it: uses the global external postgresql when the built-in is disabled
    template: temporal/secret.yaml
    documentIndex: 0
    set:
      global:
        postgresql:
          enabled: false
          external:
            host: "10.0.6.1"
            port: 6432
            user: "temporal_global"
            password: "Temporal@Global123"
      temporal:
        postgresql:
          database: "temporal_global"
    asserts:
      - equal:
          decodeBase64: true
          path: data.POSTGRES_SEEDS
          value: "10.0.6.1"
      - equal:
          decodeBase64: true
          path: data.DB_PORT
          value: "6432"
      - equal:
          decodeBase64: true
          path: data.POSTGRES_USER
          value: "temporal_global"
      - equal:
          decodeBase64: true
          path: data.POSTGRES_PWD
          value: "Temporal@Global123"
      - equal:
          decodeBase64: true
          path: data.DBNAME
          value: "temporal_global"
      - equal:
          decodeBase64: true
          path: data.VISIBILITY_DBNAME
          value: "temporal_global_visibility"

  - it: prefers the service-level postgresql over the global external
    template: temporal/secret.yaml
    documentIndex: 0
    set:
      global:
        postgresql:
          enabled: false
          external:
            host: "10.0.6.1"
            port: 6432
            user: "temporal_global"
            password: "Temporal@Global123"
      temporal:
        postgresql:
          host: "10.0.6.2"
          port: "7432"
          database: "temporal"
          user: "temporal"
          password: "Temporal@1234"
    asserts:
      - equal:
          decodeBase64: true
          path: data.POSTGRES_SEEDS
          value: "10.0.6.2"
      - equal:
          decodeBase64: true
          path: data.DB_PORT
          value: "7432"
      - equal:
          decodeBase64: true
          path: data.POSTGRES_USER
          value: "temporal"
      - equal:
          decodeBase64: true
          path: data.POSTGRES_PWD
          value: "Temporal@1234"
      - equal:
          decodeBase64: true
          path: data.DBNAME
          value: "temporal"
      - equal:
          decodeBase64: true
          path: data.VISIBILITY_DBNAME
          value: "temporal_visibility"
