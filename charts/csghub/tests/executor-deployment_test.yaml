# Test suite for the CSGHub Executor Deployment.
#
# The Deployment runs the temporal-worker launch module. The repository
# deletion-worker sidecar is currently wrapped in `{{- if false }}` and does
# not render; re-enable the block and restore the deletion-worker assertions
# in the next release.

suite: Test Executor Deployment
templates:
  - csghub/executor/deployment.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Deployment metadata and spec defaults
    template: csghub/executor/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: "csghub-executor"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "executor"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/service"]
          value: "executor"

  - it: runs the temporal-worker launch command from the ee server image
    template: csghub/executor/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "temporal-worker"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/csghub-server:v2.5.0-ee"
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/starhub-bin/starhub", "temporal-worker", "launch", "-l", "info"]
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: csghub-core
      - notExists:
          path: spec.template.spec.containers[0].ports

  - it: omits the deletion-worker sidecar (temporarily disabled)
    template: csghub/executor/deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
      - equal:
          path: spec.template.spec.containers[0].name
          value: "temporal-worker"

  - it: mounts the casdoor certs Secret for JWT signing
    template: csghub/executor/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "casdoor-init-certs"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/starhub-bin/casdoor"
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "casdoor-init-certs"
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: "csghub-casdoor-init"
      - equal:
          path: spec.template.spec.volumes[0].secret.items[0].key
          value: "tls.crt"
      - equal:
          path: spec.template.spec.volumes[0].secret.items[0].path
          value: "tls.crt"
      - equal:
          path: spec.template.spec.volumes[0].secret.items[1].key
          value: "tls.key"
      - equal:
          path: spec.template.spec.volumes[0].secret.items[1].path
          value: "tls.key"

  - it: waits for the server in the init container
    template: csghub/executor/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "wait-for-server"

  - it: overrides the image registry when registryPolicy is force
    template: csghub/executor/deployment.yaml
    set:
      global:
        image:
          registryPolicy: force
          registry: "opencsg-registry.cn-beijing.cr.aliyuncs.com"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/csghub-server:v2.5.0-ee"
