# Test suite for the CSGHub casdoor ConfigMap.
#
# The ConfigMap holds casdoor's app.conf pointing at the built-in PostgreSQL
# and the casdoor update SQL script. The init_data.json bootstrap, TLS cert,
# and admin credentials live in the casdoor-init Secret (see
# casdoor-secret_test.yaml).

suite: Test Casdoor ConfigMap
templates:
  - casdoor/configmap.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the ConfigMap metadata with the casdoor service label
    template: casdoor/configmap.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: "csghub-casdoor"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "casdoor"

  - it: points app.conf at the built-in PostgreSQL and casdoor origin
    template: casdoor/configmap.yaml
    asserts:
      - matchRegex:
          path: data["app.conf"]
          pattern: "dataSourceName\\s*=\\s*\"postgresql://csghub:[A-Za-z0-9+/=]{32}@csghub-postgresql:5432/csghub_casdoor\\?sslmode=disable\""
      - matchRegex:
          path: data["app.conf"]
          pattern: "origin\\s*=\\s*\"https://casdoor.example.com\""
      - matchRegex:
          path: data["app.conf"]
          pattern: "initDataFile\\s*=\\s*\"/conf-secrets/init_data.json\""

  - it: does not embed init_data.json in the ConfigMap
    template: casdoor/configmap.yaml
    asserts:
      - notExists:
          path: data["init_data.json"]

  - it: embeds the casdoor update SQL script
    template: casdoor/configmap.yaml
    asserts:
      - isNotNullOrEmpty:
          path: data["1768547229_casdoor_update_conf.sql"]

  - it: points app.conf at an external PostgreSQL when configured
    template: casdoor/configmap.yaml
    set:
      global:
        postgresql:
          enabled: false
          external:
            host: "10.6.0.10"
            port: 6432
            user: "postgres"
            password: "Postgres2025"
            sslmode: "prefer"
    asserts:
      - matchRegex:
          path: data["app.conf"]
          pattern: "dataSourceName\\s*=\\s*\"postgresql://postgres:Postgres2025@10.6.0.10:6432/csghub_casdoor\\?sslmode=prefer\""
