# Test suite for the CSGHub User Deployment.
#
# The Deployment runs the user module of the server image, mounting the casdoor
# certs Secret. It always renders because the built-in user has no enable
# switch.

suite: Test User Deployment
templates:
  - csghub/user/deployment.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Deployment metadata and spec defaults
    template: csghub/user/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: "csghub-user"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "user"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/service"]
          value: "user"

  - it: runs the user launch command from the ee server image
    template: csghub/user/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "user"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/csghub-server:v2.4.0-ee"
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/starhub-bin/starhub", "user", "launch", "-l", "info"]
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: "user"
      - contains:
          path: spec.template.spec.containers[0].envFrom
          content:
            configMapRef:
              name: csghub-core
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 8080

  - it: mounts the casdoor certs Secret for JWT signing
    template: csghub/user/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "jwt-token-cert"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/starhub-bin/casdoor"
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "jwt-token-cert"
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: "csghub-casdoor-certs"

  - it: waits for the server in the init container
    template: csghub/user/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "wait-for-server"

  - it: overrides the image registry when registryPolicy is force
    template: csghub/user/deployment.yaml
    set:
      global:
        image:
          registryPolicy: force
          registry: "opencsg-registry.cn-beijing.cr.aliyuncs.com"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/csghub-server:v2.4.0-ee"
