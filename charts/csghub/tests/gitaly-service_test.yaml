# Test suite for the CSGHub Gitaly Service.
#
# The Gitaly Service is a headless ClusterIP service exposing port 8075. It
# renders only when the built-in gitaly is enabled.

suite: Test Gitaly Service
templates:
  - gitaly/service.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the headless Service metadata with standard labels
    template: gitaly/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: "csghub-gitaly"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "gitaly"

  - it: renders the single port 8075 with a None cluster IP
    template: gitaly/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.clusterIP
          value: "None"
      - equal:
          path: spec.ports[0].port
          value: 8075
      - equal:
          path: spec.ports[0].targetPort
          value: 8075
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "gitaly"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "gitaly"

  - it: renders nothing when the built-in gitaly is disabled
    template: gitaly/service.yaml
    set:
      global:
        gitaly:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
