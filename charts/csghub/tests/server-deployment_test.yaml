# Test suite for the CSGHub server Deployment.
#
# The server Deployment runs the starhub server binary, sources the csghub-core
# ConfigMap, waits for redis/postgresql/gitaly/nats/temporal in init containers
# and mounts the casdoor JWT token cert. Image overrides follow the chart's
# registryPolicy rules.

suite: Test Server Deployment
templates:
  - csghub/server/deployment.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Deployment metadata and spec defaults
    template: csghub/server/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: "csghub-server"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "server"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.minReadySeconds
          value: 30
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 20
      - equal:
          path: spec.progressDeadlineSeconds
          value: 600

  - it: runs the starhub server binary with the default image
    template: csghub/server/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "server"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/csghub-server:v2.4.0-ee"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "IfNotPresent"
      - equal:
          path: spec.template.spec.containers[0].command
          value:
            - "/starhub-bin/starhub"
            - "start"
            - "server"
            - "-l"
            - "info"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: "csghub-core"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "jwt-token-cert"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/starhub-bin/casdoor"

  - it: waits for redis, postgresql, gitaly, nats and temporal in init containers
    template: csghub/server/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "wait-for-redis"
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "docker.io/redis:7.4.9"
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: "wait-for-postgresql"
      - equal:
          path: spec.template.spec.initContainers[1].image
          value: "docker.io/opencsghq/psql:latest"
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: "wait-for-gitaly"
      - equal:
          path: spec.template.spec.initContainers[2].image
          value: "docker.io/busybox:latest"
      - equal:
          path: spec.template.spec.initContainers[3].name
          value: "wait-for-nats"
      - equal:
          path: spec.template.spec.initContainers[4].name
          value: "wait-for-temporal"

  - it: renders the liveness and readiness probes
    template: csghub/server/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 20
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: "/healthz"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 8080
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 5

  - it: mounts the casdoor JWT token cert secret
    template: csghub/server/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "jwt-token-cert"
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: "csghub-casdoor-certs"

  - it: renders optional fields when set
    template: csghub/server/deployment.yaml
    set:
      server:
        replicas: 2
        serviceAccountName: "server-sa"
        environments:
          FOO: "bar"
        resources:
          limits:
            memory: 1Gi
        nodeSelector:
          diskType: ssd
        strategy:
          type: RollingUpdate
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.serviceAccountName
          value: "server-sa"
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "FOO"
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "bar"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "1Gi"
      - equal:
          path: spec.template.spec.nodeSelector.diskType
          value: "ssd"
      - equal:
          path: spec.strategy.type
          value: "RollingUpdate"
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: "/healthz"

  - it: overrides the image registry when registryPolicy is force
    template: csghub/server/deployment.yaml
    set:
      global:
        image:
          registryPolicy: force
          registry: "opencsg-registry.cn-beijing.cr.aliyuncs.com"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/csghub-server:v2.4.0-ee"
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/redis:7.4.9"
