# Test suite for the CSGHub MinIO init Job.
#
# The Job waits for minio, then runs the bucket-creation script from the minio
# ConfigMap, sourcing the minio Secret for the root credentials.

suite: Test MinIO Job
templates:
  - minio/job.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Job metadata, hooks and spec defaults
    template: minio/job.yaml
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.name
          value: "csghub-minio-init"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "minio"
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: "before-hook-creation"
      - equal:
          path: spec.completionMode
          value: "Indexed"
      - equal:
          path: spec.template.spec.restartPolicy
          value: "OnFailure"

  - it: waits for minio in the init container
    template: minio/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "wait-for-minio"
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "docker.io/busybox:latest"

  - it: runs the bucket-creation script with the minio Secret and ConfigMap
    template: minio/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "minio"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z"
      - equal:
          path: spec.template.spec.containers[0].command[0]
          value: "/scripts/1768547229_minio_create_buckets.sh"
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: "csghub-minio"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "init-scripts"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/scripts"
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "init-scripts"
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: "csghub-minio"

  - it: renders nothing when the built-in object storage is disabled
    template: minio/job.yaml
    set:
      global:
        objectStore:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
