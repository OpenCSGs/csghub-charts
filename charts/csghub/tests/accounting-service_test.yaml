# Test suite for the CSGHub Accounting Service.
#
# The Accounting Service exposes the accounting port 8086, with an additional
# payment port in the saas edition.

suite: Test Accounting Service
templates:
  - csghub/accounting/service.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Service metadata with standard labels
    template: csghub/accounting/service.yaml
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: "csghub-accounting"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "accounting"

  - it: renders the accounting port 8086
    template: csghub/accounting/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.ports[0].port
          value: 8086
      - equal:
          path: spec.ports[0].targetPort
          value: 8086
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "accounting"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "accounting"

  - it: appends the payment port in the saas edition
    template: csghub/accounting/service.yaml
    set:
      global:
        edition: "saas"
    asserts:
      - equal:
          path: spec.ports[1].port
          value: 8094
      - equal:
          path: spec.ports[1].targetPort
          value: 8094
      - equal:
          path: spec.ports[1].name
          value: "payment"
