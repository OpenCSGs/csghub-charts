# Test suite for the CSGHub Registry Deployment.
#
# The Deployment runs the registry server from the registry ConfigMap and
# Secret. It renders only when the built-in registry is enabled.

suite: Test Registry Deployment
templates:
  - registry/deployment.yaml
release:
  name: csghub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Deployment metadata and spec defaults
    template: registry/deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: "csghub-registry"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "registry"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/service"]
          value: "registry"

  - it: runs the registry server from the ConfigMap and Secret
    template: registry/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "registry"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/registry:2.8.3"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "IfNotPresent"
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 5000
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: "csghub-registry"
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: "csghub-registry"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "auth"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/auth"
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "auth"
      - equal:
          path: spec.template.spec.volumes[0].secret.secretName
          value: "csghub-registry"

  - it: overrides the image registry when registryPolicy is force
    template: registry/deployment.yaml
    set:
      global:
        image:
          registryPolicy: force
          registry: "opencsg-registry.cn-beijing.cr.aliyuncs.com"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/registry:2.8.3"

  - it: honors a custom node selector
    template: registry/deployment.yaml
    set:
      registry:
        nodeSelector:
          diskType: ssd
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector.diskType
          value: "ssd"

  - it: renders nothing when the built-in registry is disabled
    template: registry/deployment.yaml
    set:
      global:
        registry:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
