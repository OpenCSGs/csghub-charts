# CSGRelay configuration
csgrelay:
  enabled: true
  replicas: 1

  image:
    # registry: "docker.io"
    repository: "opencsghq/csgrelay"
    tag: "4228a8ca"
    pullPolicy: "IfNotPresent"
    pullSecrets: []                 # Empty falls back to global.image.pullSecrets

  ## Service Configuration
  service:
    type: "ClusterIP"
    port: 28080
    protocol: "TCP"

  log:
    format: "json"
    color: "never"

  ## CSGRelay runtime configuration
  config:
    nats:
      ## In bundled mode this falls back to the CSGHub NATS configuration.
      ## In standalone mode set this when not using existingSecret.
      ## The authenticated URL is injected through CSGRELAY_NATS_URL and
      ## overrides this credential-free URL at runtime.
      # url: "nats://nats.example.com:4222"
      namespace: ""
      replicas: 1
      recordTTL: "15m"
      advertisementTTL: "10m"

    oss:
      ## When bundled with csghub, global.objectStore is inherited and its
      ## endpoint, bucket, region, credentials and TLS/path-style settings are
      ## reused automatically:
      ## - global.objectStore.enabled=true: bundled MinIO
      ## - global.objectStore.enabled=false: external S3-compatible storage,
      ##   including Aliyun OSS
      ##
      ## Standalone agentichub does not deploy MinIO and has no
      ## global.objectStore. In standalone mode set endpoint and bucket below,
      ## or provide oss-endpoint/oss-bucket in existingSecret.
      ##
      ## Bundled MinIO example:
      ## global.objectStore.enabled=true
      ##
      ## External Aliyun OSS example:
      ## global.objectStore.enabled=false
      ## global.objectStore.external.endpoint=oss-cn-hangzhou.aliyuncs.com
      ## global.objectStore.external.bucket=csghub-relay
      ## global.objectStore.external.region=cn-hangzhou
      ## global.objectStore.external.pathStyle=false
      ##
      ## Explicit values below override the corresponding inherited field.
      # endpoint: "oss-cn-hangzhou.aliyuncs.com"
      bucket: "csghub-relay"
      # region: "cn-hangzhou"
      # enableSSL: true
      # bucketLookup: "auto"               # MinIO normally uses path; Aliyun OSS uses auto
      prefix: "csgrelay/"
      credentials: "env"

  ## Use an existing Secret instead of the generated Secret. Required keys:
  ## - tokens.toml
  ## - nats-url
  ## - oss-access-key-id
  ## - oss-access-key-secret
  ## Optional object-store keys override config.oss or inherited
  ## global.objectStore values:
  ## - oss-endpoint, oss-bucket, oss-region, oss-enable-ssl,
  ##   oss-bucket-lookup, oss-prefix, oss-credentials
  ## Endpoint and bucket must still resolve from the Secret, config.oss, or
  ## global.objectStore.
  ## tokens.toml must use the csgrelay token-file format, for example:
  ##   [server.tokens.<token>]
  ##   user_id = "publisher"
  ##   client_id = "cli"
  ##   admin = false
  existingSecret: ""

  ## Used when existingSecret is empty. In bundled mode NATS and object storage
  ## credentials are derived from the CSGHub global configuration when omitted.
  secret: {}
    # natsUrl: "nats://user:password@nats.example.com:4222"
    # ossAccessKeyId: ""
    # ossAccessKeySecret: ""
    # tokens: |
    #   [server.tokens.<token>]
    #   user_id = "publisher"
    #   client_id = "cli"
    #   admin = false

  ## Additional environment variables
  environments: {}

  ## Deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/service: csgrelay

  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  livenessProbe:
    httpGet:
      path: /livez
      port: http
      scheme: HTTP
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

  readinessProbe:
    httpGet:
      path: /healthz
      port: http
      scheme: HTTP
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
    successThreshold: 1

  startupProbe:
    httpGet:
      path: /healthz
      port: http
      scheme: HTTP
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 30
    successThreshold: 1

  route:
    enabled: true
    ## Defaults to the CSGHub domain in bundled mode and csgrelay.<domain>
    ## in standalone mode.
    # hostnames:
    #   - opencsg-stg.com
    #   - csgclaw.opencsg-stg.com

#################################################################
##  Built-in Third-party Components                            ##
#################################################################
## Embedded PostgreSQL configuration
postgresql:
  image:
    # registry: "docker.io"
    repository: "opencsghq/postgres"
    tag: "15.19"                             # Image version tag
    pullPolicy: "IfNotPresent"               # Image pull policy
    pullSecrets: []                          # Docker registry secrets

  service:
    type: "ClusterIP"                        # Service type: ClusterIP, NodePort, LoadBalancer
    port: 5432                               # Service port
    protocol: "TCP"                          # Network protocol

  databases:                                 # Databases to create on startup
    - "agentichub_agenticflow"

  parameters: {}                             # PostgreSQL runtime parameters
    # max_connections: 400                   # Dynamic parameters (triggers recreate)
    # shared_buffers: "128MB"                # Shared memory buffers

  persistence:
    # storageClass: ""                       # StorageClass for dynamic provisioning
    # accessModes: ["ReadWriteOnce"]         # Volume access permissions
    size: "50Gi"                             # Disk space allocation

## Built-in Redis configuration
redis:
  image:
    # registry: "docker.io"
    repository: "redis"
    tag: "7.4.11"                             # Image version tag
    pullPolicy: "IfNotPresent"               # Image pull policy
    pullSecrets: []                          # Docker registry secrets

  service:
    type: "ClusterIP"                        # Service type: ClusterIP, NodePort, LoadBalancer
    port: 6379                               # Service port
    protocol: "TCP"                          # Network protocol

  requirePass: false                         # Password requirement

  persistence:
    # storageClass: ""                       # StorageClass for dynamic provisioning
    # accessModes: ["ReadWriteOnce"]         # Volume access permissions
    size: "10Gi"                             # Disk space allocation

