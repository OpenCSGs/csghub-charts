# Test suite for the embedded Redis Service in agentichub.
#
# The Service is headless (clusterIP: None) and exposes the redis port.

suite: Test Redis Service
templates:
  - redis/service.yaml
release:
  name: agentichub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the headless Service metadata and labels
    template: redis/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "agentichub-redis"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "redis"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "agentichub"

  - it: renders the headless Service spec with the default port
    template: redis/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.clusterIP
          value: "None"
      - equal:
          path: spec.ports[0].port
          value: 6379
      - equal:
          path: spec.ports[0].targetPort
          value: 6379
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "redis"

  - it: renders a custom port and protocol when overridden
    template: redis/service.yaml
    set:
      redis:
        service:
          port: 7000
          protocol: "UDP"
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 7000
      - equal:
          path: spec.ports[0].targetPort
          value: 6379
      - equal:
          path: spec.ports[0].protocol
          value: "UDP"

  - it: renders nothing when built-in Redis is disabled
    template: redis/service.yaml
    set:
      global:
        redis:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in built-in mode
    template: redis/service.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0
