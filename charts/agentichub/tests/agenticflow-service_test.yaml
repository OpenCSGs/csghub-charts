# Test suite for the agenticflow Service.
#
# The Service exposes the agenticflow port (7860 by default) and selects pods
# by the agenticflow service label. It only renders when global.edition is
# not "ce".

suite: Test AgenticFlow Service
templates:
  - agenticflow/service.yaml
release:
  name: agentichub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the Service metadata and labels
    template: agenticflow/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "agentichub-agenticflow"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "agenticflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "agentichub"
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: "agentichub"
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: "Helm"

  - it: renders the Service spec with default port
    template: agenticflow/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.ports[0].port
          value: 7860
      - equal:
          path: spec.ports[0].targetPort
          value: 7860
      - equal:
          path: spec.ports[0].protocol
          value: "TCP"
      - equal:
          path: spec.ports[0].name
          value: "agenticflow"
      - equal:
          path: spec.selector["app.kubernetes.io/service"]
          value: "agenticflow"

  - it: renders a custom port when service.port is overridden
    template: agenticflow/service.yaml
    set:
      agenticflow:
        service:
          port: 9090
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 9090

  - it: renders a custom service type when overridden
    template: agenticflow/service.yaml
    set:
      agenticflow:
        service:
          type: NodePort
    asserts:
      - equal:
          path: spec.type
          value: "NodePort"

  - it: renders a custom protocol when overridden
    template: agenticflow/service.yaml
    set:
      agenticflow:
        service:
          protocol: "UDP"
    asserts:
      - equal:
          path: spec.ports[0].protocol
          value: "UDP"

  - it: renders nothing when the edition is ce
    template: agenticflow/service.yaml
    set:
      global:
        edition: "ce"
    asserts:
      - hasDocuments:
          count: 0