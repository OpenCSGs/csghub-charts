# Test suite for the embedded Redis StatefulSet in agentichub.
#
# The StatefulSet renders only when built-in Redis is enabled in standalone
# mode. The container args depend on redis.requirePass.

suite: Test Redis StatefulSet
templates:
  - redis/statefulset.yaml
release:
  name: agentichub
  namespace: csghub
values:
  - values.yaml
tests:
  ## ------------------------------------------------------------------
  ## Metadata and labels
  ## ------------------------------------------------------------------
  - it: renders the StatefulSet metadata with standard labels
    template: redis/statefulset.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "agentichub-redis"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "redis"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "agentichub"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  - it: renders the StatefulSet spec defaults
    template: redis/statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.serviceName
          value: "agentichub-redis"
      - equal:
          path: spec.minReadySeconds
          value: 30
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/service"]
          value: "redis"
      - equal:
          path: spec.template.spec.terminationGracePeriodSeconds
          value: 20

  ## ------------------------------------------------------------------
  ## Container image, args and probes
  ## ------------------------------------------------------------------
  - it: renders the redis container with image, basic args and probes
    template: redis/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "redis"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/redis:7.4.9"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "IfNotPresent"
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--save", "60 1000", "--appendonly", "yes"]
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 6379
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 6379
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 10
      - notExists:
          path: spec.template.spec.containers[0].envFrom
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[0]
          value: "redis-cli"

  - it: appends --requirepass and mounts the secret when requirePass is true
    template: redis/statefulset.yaml
    set:
      redis:
        requirePass: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["--requirepass", "$(REDIS_PASSWD)", "--save", "60 1000", "--appendonly", "yes"]
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].secretRef.name
          value: "agentichub-redis"
      - contains:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          content: "-a"
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[6]
          value: "$(REDIS_PASSWD)"

  - it: renders the data volume mount
    template: redis/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "data"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/data"

  ## ------------------------------------------------------------------
  ## Image configuration
  ## ------------------------------------------------------------------
  - it: prefers service-level pullSecrets over global pullSecrets
    template: redis/statefulset.yaml
    set:
      redis:
        image:
          pullSecrets:
            - "svc-secret"
      global:
        image:
          pullSecrets:
            - "global-secret"
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "svc-secret"

  - it: prefers the service-level pull policy over the global pull policy
    template: redis/statefulset.yaml
    set:
      redis:
        image:
          pullPolicy: "Always"
      global:
        image:
          pullPolicy: "Never"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "Always"

  ## ------------------------------------------------------------------
  ## Volume claim template
  ## ------------------------------------------------------------------
  - it: renders the volume claim template from global persistence defaults
    template: redis/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: "data"
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: "ReadWriteOnce"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "10Gi"

  - it: renders the volume claim template from service-level persistence
    template: redis/statefulset.yaml
    set:
      redis:
        persistence:
          storageClass: "local"
          size: "20Gi"
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: "local"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "20Gi"

  ## ------------------------------------------------------------------
  ## Container environments and scheduling
  ## ------------------------------------------------------------------
  - it: renders container environments when set
    template: redis/statefulset.yaml
    set:
      redis:
        environments:
          REDIS_MAXMEMORY: "256mb"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "REDIS_MAXMEMORY"
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "256mb"

  - it: renders nodeSelector, tolerations, affinity and topologySpreadConstraints when set
    template: redis/statefulset.yaml
    set:
      redis:
        nodeSelector:
          diskType: "ssd"
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "csghub"
            effect: "NoSchedule"
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: "kubernetes.io/hostname"
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: "kubernetes.io/hostname"
            whenUnsatisfiable: "ScheduleAnyway"
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["diskType"]
          value: "ssd"
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: "dedicated"
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1

  - it: renders the pod security context when set
    template: redis/statefulset.yaml
    set:
      redis:
        podSecurityContext:
          fsGroup: 999
          runAsUser: 999
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 999
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 999

  - it: renders the container security context, startup probe and lifecycle when set
    template: redis/statefulset.yaml
    set:
      redis:
        securityContext:
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command: ["redis-cli", "ping"]
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "10"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command[0]
          value: "redis-cli"
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command[1]
          value: "10"

  ## ------------------------------------------------------------------
  ## Spec overrides and conditional rendering
  ## ------------------------------------------------------------------
  - it: renders overridden spec scalars when provided
    template: redis/statefulset.yaml
    set:
      redis:
        replicas: 3
        minReadySeconds: 10
        revisionHistoryLimit: 5
        updateStrategy:
          type: RollingUpdate
        podManagementPolicy: "Parallel"
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.minReadySeconds
          value: 10
      - equal:
          path: spec.revisionHistoryLimit
          value: 5
      - equal:
          path: spec.updateStrategy.type
          value: "RollingUpdate"
      - equal:
          path: spec.podManagementPolicy
          value: "Parallel"

  - it: renders nothing when built-in Redis is disabled
    template: redis/statefulset.yaml
    set:
      global:
        redis:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in built-in mode
    template: redis/statefulset.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0