# Test suite for the embedded PostgreSQL Service in agentichub.
#
# The Service is headless (clusterIP: None) and exposes the postgresql port.

suite: Test PostgreSQL Service
templates:
  - postgresql/service.yaml
release:
  name: agentichub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the headless Service metadata and labels
    template: postgresql/service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "agentichub-postgresql"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "postgresql"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "agentichub"

  - it: renders the headless Service spec with the default port
    template: postgresql/service.yaml
    asserts:
      - equal:
          path: spec.type
          value: "ClusterIP"
      - equal:
          path: spec.clusterIP
          value: "None"
      - equal:
          path: spec.ports[0].port
          value: 5432
      - equal:
          path: spec.ports[0].targetPort
          value: 5432
      - equal:
          path: spec.ports[0].name
          value: "postgresql"

  - it: renders a custom port and protocol when overridden
    template: postgresql/service.yaml
    set:
      postgresql:
        service:
          port: 6432
          protocol: "UDP"
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 6432
      - equal:
          path: spec.ports[0].targetPort
          value: 5432
      - equal:
          path: spec.ports[0].protocol
          value: "UDP"

  - it: renders nothing when built-in PostgreSQL is disabled
    template: postgresql/service.yaml
    set:
      global:
        postgresql:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in built-in mode
    template: postgresql/service.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0