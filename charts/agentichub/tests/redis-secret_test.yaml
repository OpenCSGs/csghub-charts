# Test suite for the embedded Redis Secret in agentichub.
#
# The Secret renders only when redis.requirePass is true and built-in Redis
# is enabled in standalone mode. The release is "agentichub" so the service
# name is "agentichub-redis".

suite: Test Redis Secret
templates:
  - redis/secret.yaml
release:
  name: agentichub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders nothing when requirePass is false (default)
    template: redis/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Secret metadata with a keep annotation when requirePass is true
    template: redis/secret.yaml
    set:
      redis:
        requirePass: true
    asserts:
      - equal:
          path: metadata.name
          value: "agentichub-redis"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "redis"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "agentichub"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: renders the generated REDIS_PASSWD
    template: redis/secret.yaml
    set:
      redis:
        requirePass: true
    asserts:
      - matchRegex:
          path: data.REDIS_PASSWD
          pattern: "^[A-Za-z0-9+/=]+$"

  - it: renders nothing when built-in Redis is disabled
    template: redis/secret.yaml
    set:
      global:
        redis:
          enabled: false
      redis:
        requirePass: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in built-in mode
    template: redis/secret.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
      redis:
        requirePass: true
    asserts:
      - hasDocuments:
          count: 0
