# Test suite for the csgrelay Secret.

suite: Test CSGRelay Secret
templates:
  - csgrelay/secret.yaml
release:
  name: agentichub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the generated Secret metadata
    template: csgrelay/secret.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "agentichub-csgrelay"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "csgrelay"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: type
          value: "Opaque"

  - it: renders the required secret keys
    template: csgrelay/secret.yaml
    asserts:
      - exists:
          path: data["nats-url"]
      - exists:
          path: data["oss-access-key-id"]
      - exists:
          path: data["oss-access-key-secret"]
      - exists:
          path: data["tokens.toml"]
      - equal:
          path: data["oss-access-key-id"]
          value: "dGVzdC1vc3MtYWNjZXNzLWtleQ=="
      - equal:
          path: data["oss-access-key-secret"]
          value: "dGVzdC1vc3Mtc2VjcmV0LWtleQ=="

  - it: renders the authenticated NATS URL
    template: csgrelay/secret.yaml
    asserts:
      - equal:
          path: data["nats-url"]
          value: "bmF0czovL25hdHMtdXNlcjpuYXRzLXBhc3N3b3JkQG5hdHMuZXhhbXBsZS5jb206NDIyMg=="

  - it: reuses the bundled MinIO credentials
    template: csgrelay/secret.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
        nats:
          enabled: true
        objectStore:
          enabled: true
      csgrelay:
        config:
          nats:
            url: ""
          oss:
            endpoint: ""
            bucket: ""
        secret:
          natsUrl: ""
          ossAccessKeyId: ""
          ossAccessKeySecret: ""
    asserts:
      - equal:
          path: data["oss-access-key-id"]
          value: "bWluaW8="
      - matchRegex:
          path: data["oss-access-key-secret"]
          pattern: "^[A-Za-z0-9+/=]+$"
      - matchRegex:
          path: data["nats-url"]
          pattern: "^[A-Za-z0-9+/=]+$"

  - it: reuses external Aliyun OSS credentials
    template: csgrelay/secret.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
        nats:
          enabled: true
        objectStore:
          enabled: false
          external:
            endpoint: "https://objects.example.com"
            accessKey: "bundled-access-key"
            secretKey: "bundled-secret-key"
            bucket: "relay-files"
            pathStyle: false
      csgrelay:
        config:
          nats:
            url: ""
          oss:
            endpoint: ""
            bucket: ""
        secret:
          natsUrl: ""
          ossAccessKeyId: ""
          ossAccessKeySecret: ""
    asserts:
      - equal:
          path: data["oss-access-key-id"]
          value: "YnVuZGxlZC1hY2Nlc3Mta2V5"
      - equal:
          path: data["oss-access-key-secret"]
          value: "YnVuZGxlZC1zZWNyZXQta2V5"
      - matchRegex:
          path: data["nats-url"]
          pattern: "^[A-Za-z0-9+/=]+$"

  - it: does not render a Secret when an existing Secret is configured
    template: csgrelay/secret.yaml
    set:
      csgrelay:
        existingSecret: "existing-csgrelay"
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing when csgrelay is disabled
    template: csgrelay/secret.yaml
    set:
      csgrelay:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
