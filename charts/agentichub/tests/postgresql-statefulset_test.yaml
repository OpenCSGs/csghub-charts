# Test suite for the embedded PostgreSQL StatefulSet in agentichub.
#
# The StatefulSet renders only when built-in PostgreSQL is enabled and the
# chart is in standalone mode. It runs a clear-pgdata init container, mounts
# the runtime ConfigMap, and uses a volumeClaimTemplate for the data volume.
#
# Note: agentichub's statefulset container imagePullPolicy uses
# `dig "image" "pullPolicy" nil $service` (different from dataflow's
# `$service.image.pullPolicy`); this is tested below.

suite: Test PostgreSQL StatefulSet
templates:
  - postgresql/statefulset.yaml
release:
  name: agentichub
  namespace: csghub
values:
  - values.yaml
tests:
  ## ------------------------------------------------------------------
  ## Metadata and labels
  ## ------------------------------------------------------------------
  - it: renders the StatefulSet metadata with standard labels
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "agentichub-postgresql"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "postgresql"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "agentichub"
      - equal:
          path: metadata.annotations["reloader.stakater.com/auto"]
          value: "true"

  ## ------------------------------------------------------------------
  ## Init container (clear-pgdata)
  ## ------------------------------------------------------------------
  - it: renders the clear-pgdata init container
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: "clear-pgdata-as-needed"
      - equal:
          path: spec.template.spec.initContainers[0].image
          value: "docker.io/busybox:latest"
      - matchRegex:
          path: spec.template.spec.initContainers[0].command[2]
          pattern: "lost\\+found"

  ## ------------------------------------------------------------------
  ## Container image, args and probes
  ## ------------------------------------------------------------------
  - it: renders the postgres container with image, args and probes
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: "postgresql"
      - equal:
          path: spec.template.spec.containers[0].image
          value: "docker.io/opencsghq/postgres:15.18"
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "IfNotPresent"
      - equal:
          path: spec.template.spec.containers[0].args
          value: ["-c", "config_file=/etc/postgresql/runtime.conf"]
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 5432
      - equal:
          path: spec.template.spec.containers[0].envFrom[0].configMapRef.name
          value: "agentichub-postgresql"
      - equal:
          path: spec.template.spec.containers[0].envFrom[1].secretRef.name
          value: "agentichub-postgresql"
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 5432
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command[0]
          value: "pg_isready"

  ## ------------------------------------------------------------------
  ## Volume mounts and runtime ConfigMap
  ## ------------------------------------------------------------------
  - it: renders the data and runtime volume mounts
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "data"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: "runtime"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].subPath
          value: "runtime.conf"
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "runtime"
      - equal:
          path: spec.template.spec.volumes[0].configMap.name
          value: "agentichub-postgresql"

  ## ------------------------------------------------------------------
  ## Image configuration
  ## ------------------------------------------------------------------
  - it: prefers service-level pullSecrets over global pullSecrets
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        image:
          pullSecrets:
            - "svc-secret"
      global:
        image:
          pullSecrets:
            - "global-secret"
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: "svc-secret"

  - it: prefers the service-level pull policy over the global pull policy
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        image:
          pullPolicy: "Always"
      global:
        image:
          pullPolicy: "Never"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: "Always"

  ## ------------------------------------------------------------------
  ## Volume claim template
  ## ------------------------------------------------------------------
  - it: renders the volume claim template from service-level persistence
    template: postgresql/statefulset.yaml
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.name
          value: "data"
      - equal:
          path: spec.volumeClaimTemplates[0].metadata.annotations["helm.sh/resource-policy"]
          value: "keep"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes[0]
          value: "ReadWriteOnce"
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: "50Gi"
      - notExists:
          path: spec.volumeClaimTemplates[0].spec.storageClassName

  ## ------------------------------------------------------------------
  ## Container environments and scheduling
  ## ------------------------------------------------------------------
  - it: renders container environments when set
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        environments:
          POSTGRES_INITDB_ARGS: "--data-checksums"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].name
          value: "POSTGRES_INITDB_ARGS"
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: "--data-checksums"

  - it: renders nodeSelector, tolerations, affinity and topologySpreadConstraints when set
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        nodeSelector:
          diskType: "ssd"
        tolerations:
          - key: "dedicated"
            operator: "Equal"
            value: "csghub"
            effect: "NoSchedule"
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: "kubernetes.io/hostname"
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: "kubernetes.io/hostname"
            whenUnsatisfiable: "ScheduleAnyway"
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["diskType"]
          value: "ssd"
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: "dedicated"
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
      - equal:
          path: spec.template.spec.topologySpreadConstraints[0].maxSkew
          value: 1

  - it: renders the pod security context when set
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        podSecurityContext:
          fsGroup: 999
          runAsUser: 999
    asserts:
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 999
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 999

  - it: renders the container security context, startup probe and lifecycle when set
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        securityContext:
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command: ["pg_isready"]
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "10"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].startupProbe.exec.command[0]
          value: "pg_isready"
      - equal:
          path: spec.template.spec.containers[0].lifecycle.preStop.exec.command[1]
          value: "10"

  ## ------------------------------------------------------------------
  ## Spec overrides and conditional rendering
  ## ------------------------------------------------------------------
  - it: renders overridden spec scalars when provided
    template: postgresql/statefulset.yaml
    set:
      postgresql:
        replicas: 3
        minReadySeconds: 10
        revisionHistoryLimit: 5
        updateStrategy:
          type: RollingUpdate
        podManagementPolicy: "Parallel"
    asserts:
      - equal:
          path: spec.replicas
          value: 3
      - equal:
          path: spec.minReadySeconds
          value: 10
      - equal:
          path: spec.revisionHistoryLimit
          value: 5
      - equal:
          path: spec.updateStrategy.type
          value: "RollingUpdate"
      - equal:
          path: spec.podManagementPolicy
          value: "Parallel"

  - it: renders nothing when built-in PostgreSQL is disabled
    template: postgresql/statefulset.yaml
    set:
      global:
        postgresql:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders nothing in built-in mode
    template: postgresql/statefulset.yaml
    set:
      global:
        chartContext:
          isBuiltIn: true
    asserts:
      - hasDocuments:
          count: 0