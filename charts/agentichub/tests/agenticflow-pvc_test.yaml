# Test suite for the agenticflow PersistentVolumeClaim.
#
# The PVC is named data-<serviceName>. It uses service-level persistence
# when set, falling back to global persistence defaults. Only renders when
# global.edition is not "ce".

suite: Test AgenticFlow PVC
templates:
  - agenticflow/pvc.yaml
release:
  name: agentichub
  namespace: csghub
values:
  - values.yaml
tests:
  - it: renders the PVC metadata with a keep annotation
    template: agenticflow/pvc.yaml
    asserts:
      - equal:
          path: metadata.name
          value: "data-agentichub-agenticflow"
      - equal:
          path: metadata.namespace
          value: "csghub"
      - equal:
          path: metadata.labels["app.kubernetes.io/service"]
          value: "agentichub-agenticflow"
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: "agentichub"
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: "keep"

  - it: renders the PVC spec from service-level persistence
    template: agenticflow/pvc.yaml
    asserts:
      - equal:
          path: spec.accessModes[0]
          value: "ReadWriteOnce"
      - equal:
          path: spec.resources.requests.storage
          value: "20Gi"
      - notExists:
          path: spec.storageClassName

  - it: renders the global storageClass when service-level is unset
    template: agenticflow/pvc.yaml
    set:
      global:
        persistence:
          storageClass: "nfs-provisioner"
    asserts:
      - equal:
          path: spec.storageClassName
          value: "nfs-provisioner"

  - it: prefers the service-level storageClass over the global one
    template: agenticflow/pvc.yaml
    set:
      global:
        persistence:
          storageClass: "global-sc"
      agenticflow:
        persistence:
          storageClass: "local-sc"
    asserts:
      - equal:
          path: spec.storageClassName
          value: "local-sc"

  - it: renders nothing when the edition is ce
    template: agenticflow/pvc.yaml
    set:
      global:
        edition: "ce"
    asserts:
      - hasDocuments:
          count: 0
