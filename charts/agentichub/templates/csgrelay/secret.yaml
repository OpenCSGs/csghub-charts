{{- $service := include "common.service" (dict "ctx" . "service" "csgrelay") | fromYaml }}
{{- $serviceName := include "common.names.custom" (list . $service.name) }}
{{- $secretName := include "csgrelay.secretName" . }}
{{- if and .Values.csgrelay.enabled (ne .Values.global.edition "ce") (not .Values.csgrelay.existingSecret) }}
{{- $nats := include "csgrelay.natsConfig" . | fromYaml }}
{{- $s3 := include "csgrelay.s3Config" . | fromYaml }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $tokens := dig "tokens" "" .Values.csgrelay.secret }}
{{- if and (not $tokens) $existingSecret (index $existingSecret.data "tokens.toml") }}
{{- $tokens = index $existingSecret.data "tokens.toml" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/service: {{ $service.name }}
    {{- include "common.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  nats-url: {{ $nats.url | b64enc | quote }}
  oss-access-key-id: {{ $s3.accessKey | b64enc | quote }}
  oss-access-key-secret: {{ $s3.secretKey | b64enc | quote }}
  tokens.toml: {{ $tokens | b64enc | quote }}
{{- end }}
