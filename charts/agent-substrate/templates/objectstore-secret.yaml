{{- if and .Values.controlPlane.enabled (eq (include "agent-substrate.objectStore.createSecret" .) "true") }}
{{- $cfg := include "agent-substrate.objectStore.config" . | fromYaml }}
{{- if not $cfg.endpoint }}
{{- fail "objectStore.endpoint is required when creating the object-store Secret from values" }}
{{- end }}
{{- if not $cfg.bucket }}
{{- fail "objectStore.bucket is required when creating the object-store Secret from values" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-substrate.objectStore.managedSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-substrate.labels" . | nindent 4 }}
    app.kubernetes.io/component: objectstore
  annotations:
    ## Keep credentials across helm uninstall/upgrade unless explicitly deleted.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  OBJECT_STORE_ENDPOINT: {{ $cfg.endpoint | quote }}
  OBJECT_STORE_ACCESS_KEY: {{ $cfg.accessKey | quote }}
  OBJECT_STORE_SECRET_KEY: {{ $cfg.secretKey | quote }}
  OBJECT_STORE_REGION: {{ $cfg.region | quote }}
  OBJECT_STORE_BUCKET: {{ $cfg.bucket | quote }}
{{- end }}
