## Example install values. Copy, fill objectStore.bucket/endpoint/region
## (and existingSecret or accessKey/secretKey); do not commit real credentials.

images:
  repo: opencsg-registry.cn-beijing.cr.aliyuncs.com/opencsghq/agent-substrate/substrate
  tag: v1.0.0
  pullPolicy: IfNotPresent
  # pullSecrets:
  #   - name: acr-pull

atenet:
  dataplane: agentgateway

## Parking uses Agentgateway schema defaults; requestTimeout covers
## wakeupProbe (120s) + park budget until response headers.
agentgateway:
  requestParking:
    budget: 5s
    max: 1024
    retryInterval: 100ms
    retryFactor: 1.1
  requestTimeout: 180s

actorDefaults:
  wakeupProbe:
    timeoutSeconds: 120
  egress:
    allowAll: true

objectStore:
  backend: s3
  ## Fill before install (no chart defaults).
  bucket: ""
  endpoint: ""
  region: ""
  # snapshotLocation omitted → gs://{{ bucket }}/
  pathStyle: true
  secure: true
  transferServiceAccount: unused
  ## Prefer a pre-created Secret in the release namespace (see chart README).
  existingSecret: ""
  ## Or omit existingSecret and set accessKey/secretKey so the chart creates
  ## <release>-objectstore (do not commit real credentials).

## Bundled Postgres (default): chart wires DSNs + role setup. No external PG.
postgres:
  bundled: true
  bundledStorageSize: 20Gi

credentialProvider:
  enabled: true

workerPools:
  - name: csghub-default
    namespace: "ate-system"
    ## Warm floor when HPA is off. With HPA on, set this ≈ hpa.minReplicas.
    replicas: 5
    labels:
      csghub.opencsg.com/pool: csghub-default
    sandboxClass: gvisor
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 2Gi
    ## Requires Prometheus + prometheus-adapter for ate_workerpool_workers.
    hpa:
      enabled: false
      minReplicas: 5
      maxReplicas: 40
      averageValue: "0.7"

api:
  logLevel: info
  postgres:
    readWriteRole: substrate_readwrite
    ownerRole: substrate_owner
    schema: substrate
